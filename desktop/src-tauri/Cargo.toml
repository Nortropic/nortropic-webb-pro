[package]
name = "nortropic"
version = "0.2.0"
description = "Nortropic: lokal arbetsplats för kundportalen (Tauri 2-skal runt motorns arbetsyta)"
edition = "2021"
publish = false

[lib]
name = "nortropic_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-notification = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
# uppdateringen: samma signaturkontroll som Tauris uppdateringsmodul (minisign), utan dess TLS-stack (kunskap/desktop.md, Uppdatering)
minisign-verify = "0.2"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"

[features]
# Provinstrumenteringen (kunskap/desktop.md, Prov): bara i provbygget, aldrig i användarbygget.
prov = []

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
