<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nortropic webb-pro</title>
<style>
:root {
  --bg: #f5f4f0; --yta: #ffffff; --yta2: #faf9f6; --text: #1c1b19; --dampad: #6a675f; --linje: #e3e0d8;
  --accent: #1d5b47; --accent-mjuk: #e3efe9; --gron: #1e7a4b; --gron-mjuk: #e4f3ea; --rod: #b1281f; --rod-mjuk: #fbe9e7;
  --gul: #8a6200; --gul-mjuk: #fbf1d9; --skugga: 0 1px 2px rgba(20,18,12,.05), 0 4px 16px rgba(20,18,12,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131311; --yta: #1b1b19; --yta2: #20201d; --text: #ebe9e4; --dampad: #a3a097; --linje: #2f2e2a;
    --accent: #7fc4a6; --accent-mjuk: #1e2f28; --gron: #6fcf97; --gron-mjuk: #17291f; --rod: #f08a80; --rod-mjuk: #33201d;
    --gul: #e6b84d; --gul-mjuk: #302714; --skugga: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--dampad); padding: 6px 10px; border-radius: 8px; font-size: 14px; }
nav a:hover { color: var(--text); background: var(--yta); }
nav a.aktiv { color: var(--text); background: var(--yta); box-shadow: inset 0 0 0 1px var(--linje); }
nav b { font-weight: 600; font-size: 12px; background: var(--accent-mjuk); color: var(--accent); border-radius: 99px; padding: 1px 7px; margin-left: 4px; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; line-height: 1.2; }
h2 { font-size: 17px; margin: 28px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 18px 0 6px; }
.under { color: var(--dampad); margin: 0 0 20px; }
.kort { background: var(--yta); border: 1px solid var(--linje); border-radius: 12px; padding: 16px 18px; box-shadow: var(--skugga); }
.rutnat { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.siffror { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 8px; }
.siffra { padding: 14px 16px; }
.siffra .tal { font-size: 28px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.siffra .etikett { color: var(--dampad); font-size: 13px; }
.bygge-kort { display: block; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.bygge-kort:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--linje)); }
.bygge-kort .namn { font-weight: 620; font-size: 16px; }
.bygge-kort .ort { color: var(--dampad); font-size: 13px; }
.steg { display: flex; gap: 4px; margin: 12px 0 10px; }
.steg i { flex: 1; height: 6px; border-radius: 3px; background: var(--linje); }
.steg i.klar { background: var(--accent); }
.steglista { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 18px 0 6px; }
.steglista div { font-size: 12px; color: var(--dampad); border-top: 3px solid var(--linje); padding-top: 6px; }
.steglista div.klar { color: var(--text); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--yta2); border: 1px solid var(--linje); color: var(--dampad); white-space: nowrap; }
.chip.ok { background: var(--gron-mjuk); color: var(--gron); border-color: transparent; }
.chip.rod { background: var(--rod-mjuk); color: var(--rod); border-color: transparent; }
.chip.gul { background: var(--gul-mjuk); color: var(--gul); border-color: transparent; }
.chip.acc { background: var(--accent-mjuk); color: var(--accent); border-color: transparent; }
.puls::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; animation: puls 1.4s ease-in-out infinite; }
@keyframes puls { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .puls::before { animation: none; } }
.rad { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mellan { justify-content: space-between; }
.knapp { appearance: none; border: 1px solid var(--linje); background: var(--yta); color: var(--text); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 9px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.knapp:hover { border-color: var(--dampad); }
.knapp.primar { background: var(--accent); border-color: var(--accent); color: var(--yta); font-weight: 560; }
.knapp:disabled { opacity: .5; cursor: default; }
#qr { border: 1px solid var(--linje); border-radius: 12px; background: var(--yta); color: var(--text); padding: 16px; max-width: 360px; }
#qr svg { display: block; width: 100%; height: auto; margin-top: 12px; }
#qr::backdrop { background: rgb(0 0 0 / .4); }
details.mer { display: inline; }
details.mer summary { display: inline; cursor: pointer; color: var(--accent); }
details.mer[open] { display: block; margin-top: 4px; }
.flikar { display: flex; gap: 2px; border-bottom: 1px solid var(--linje); margin: 22px 0 18px; overflow-x: auto; }
.flikar button { appearance: none; border: 0; background: none; font: inherit; font-size: 14px; color: var(--dampad); padding: 9px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.flikar button.aktiv { color: var(--text); border-color: var(--text); }
/* flikarna i Dokumentation och rapporter är länkar i en nav: inte toppnavigeringens knappar, och de bryts i mobilen */
nav.flikar { flex-wrap: wrap; gap: 0 2px; }
nav.flikar a { font-size: 14px; color: var(--dampad); padding: 9px 12px; text-decoration: none; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.flikar a:hover { background: none; color: var(--text); }
nav.flikar a[aria-current="page"] { color: var(--text); border-color: var(--text); }
.bilder { display: grid; gap: 14px; grid-template-columns: 220px 1fr; align-items: start; }
.bilder figure { margin: 0; }
.bilder img, .galleri img { width: 100%; border: 1px solid var(--linje); border-radius: 10px; display: block; background: var(--yta2); }
figcaption { font-size: 12px; color: var(--dampad); margin-top: 6px; }
.galleri { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
@media (max-width: 700px) { .bilder { grid-template-columns: 1fr; } .steglista { grid-template-columns: repeat(4, 1fr); } }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linje); vertical-align: top; }
th { color: var(--dampad); font-weight: 560; font-size: 13px; }
td.tal, th.tal { text-align: right; font-variant-numeric: tabular-nums; }
.tabell { overflow-x: auto; }
.prosa { max-width: 78ch; }
.flode :is(code, a, li, p) { overflow-wrap: anywhere; }
.flode .flodesbesked { margin: 0; display: grid; gap: 14px; }
.flodesbesked > div { min-width: 0; }
.flodesbesked dt { font-weight: 560; }
.flodesbesked dd { margin: 4px 0 0; overflow-wrap: anywhere; }
.flode [data-flodeshandling], .flode [data-flode-las] { min-height: 44px; max-width: 100%; white-space: normal; }
.flode .knapp:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }  /* långa kommandon och sökvägar bryts i mobilen */
.prosa p, .prosa li { margin: 6px 0; }
.prosa code, code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--yta2); border: 1px solid var(--linje); border-radius: 5px; padding: 1px 5px; }
pre { background: var(--yta2); border: 1px solid var(--linje); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
pre code { border: 0; padding: 0; background: none; }
blockquote { margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--linje); color: var(--dampad); }
.tom { color: var(--dampad); padding: 22px; text-align: center; border: 1px dashed var(--linje); border-radius: 12px; }
.handling { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dampad); padding: 4px 0; border-bottom: 1px solid var(--linje); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.handling b { color: var(--text); font-weight: 600; }
.fraga { padding: 16px 0; border-bottom: 1px solid var(--linje); }
.fraga > label, .fraga > .q { display: block; font-weight: 560; margin-bottom: 10px; }
.fraga .varfor { font-weight: 400; color: var(--dampad); font-size: 13px; display: block; margin-top: 2px; }
.val { display: flex; flex-wrap: wrap; gap: 6px; }
.val label { cursor: pointer; }
.val input { position: absolute; opacity: 0; pointer-events: none; }
.val span { display: inline-block; padding: 7px 12px; border: 1px solid var(--linje); border-radius: 99px; font-size: 14px; background: var(--yta); }
.val input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--yta); }
.val input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.skala { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.skala small { color: var(--dampad); }
input[type=file] { font: inherit; font-size: 14px; color: var(--dampad); max-width: 100%; }
textarea, input[type=url], input[type=text] { width: 100%; font: inherit; color: inherit; background: var(--yta); border: 1px solid var(--linje); border-radius: 9px; padding: 9px 11px; }
textarea { min-height: 76px; resize: vertical; }
textarea:focus, input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.matris td, .matris th { text-align: center; padding: 6px 4px; }
.val.cell { justify-content: center; flex-wrap: nowrap; }
@media (max-width: 520px) { .val.cell span { padding: 6px 9px; font-size: 13px; } .matris td:first-child { font-size: 13px; } }
.matris td:first-child, .matris th:first-child { text-align: left; }
.fraga img { max-width: 520px; width: 100%; border: 1px solid var(--linje); border-radius: 10px; margin-bottom: 10px; }
.alt-bilder { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 820px; margin-bottom: 10px; }
.alt-bilder figure { margin: 0; }
.alt-bilder img { max-width: 100%; margin-bottom: 4px; display: block; }
.kverktyg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 18px; }
.kverktyg .knapp[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--yta); }
.kgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--kmin, 260px)), 1fr)); }
.kkort { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.kkort.markerad { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-mjuk); }
.kkort h3 { margin: 0; font-size: 16px; }
.kram { display: block; border: 1px solid var(--linje); border-radius: 10px; overflow: hidden; background: var(--yta2); }
.kram img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border: 0; border-radius: 0; }
.kram.v390 { aspect-ratio: 390 / 844; } .kram.v768 { aspect-ratio: 768 / 1024; } .kram.v1440 { aspect-ratio: 1440 / 900; }
.kram.v1280 { aspect-ratio: auto; } .kram.v1280 img { height: auto; }  /* mellanbreddens höjd följer bilden */
.kram.hela { aspect-ratio: auto; height: 560px; overflow-y: auto; }
.kram.hela img { height: auto; object-fit: initial; }
/* mobil och dator bredvid varandra i samma höjd och nästan samma skala: 390/844 mot 1440/900 ger kolumnerna 1 : 3,46 */
.kpar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3.46fr); gap: 12px; align-items: start; }
.kfig { margin: 0; }
.kfig figcaption { margin-top: 4px; }
.kjamfor { display: grid; gap: 16px; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); overflow-x: auto; padding-bottom: 6px; }
.kjamfor.v390 { grid-auto-columns: minmax(240px, 300px); }  /* mobilen i mobilstorlek, också när få är markerade */
.kjamfor.v1280, .kjamfor.v1440 { grid-auto-columns: minmax(480px, 1fr); }
.kjamfor .kram.hela { height: 75vh; }
.kdel { border-top: 1px solid var(--linje); padding-top: 8px; }
.kdel > summary { cursor: pointer; font-weight: 560; }
/* observationen: det som syns i sessionernas transkript och loggar under arbetet (kontroller/observation.py) */
.obs { margin-top: 28px; }
.obs-grid { display: grid; gap: 12px 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); margin: 8px 0; }
.obs-grid h4 { margin: 0 0 4px; font-size: 13px; color: var(--dampad); font-weight: 600; }
.obs ul { margin: 4px 0; padding-left: 18px; }
.obs-bilder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3.46fr); gap: 8px; align-items: start; }
.obs-bilder img { width: 100%; display: block; border: 1px solid var(--linje); border-radius: 8px; }
.obs-not { font-size: 12px; color: var(--dampad); }
.obs-varn { font-size: 12px; color: var(--gul); }
.kdel .under { margin: 6px 0; }
.kdel > h4 { margin: 16px 0 4px; font-size: 14.5px; }
.kdel .prosa :is(h3, h4, h5) { margin: 10px 0 2px; font-size: 13px; font-weight: 600; color: var(--dampad); }  /* skaparens underrubriker under vyns */
.kjref { display: grid; gap: 12px; align-items: start; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kjref.v390 { grid-template-columns: repeat(2, minmax(0, 260px)); }
.kdel ul { margin: 6px 0; padding-left: 20px; }
.ktek > summary { font-weight: 500; color: var(--dampad); }
@media (max-width: 700px) { .kpar { grid-template-columns: 1fr; } .kpar .kfig:first-child { max-width: 240px; } }
.kkort textarea { min-height: 64px; font-size: 14px; }
.kkort .rad { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kkort label.markera { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; font-weight: 560; cursor: pointer; }
.kkort label.markera input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.kverktyg .skiljare { width: 1px; align-self: stretch; background: var(--linje); margin: 0 4px; }
.alt-bilder figcaption { font-size: 13px; color: var(--dampad); }
.kommando { display: flex; gap: 8px; align-items: stretch; margin: 6px 0 14px; }
.kommando code { flex: 1; display: block; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
details.post { border: 1px solid var(--linje); border-radius: 12px; background: var(--yta); margin-bottom: 10px; }
details.post summary { cursor: pointer; padding: 13px 16px; list-style: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details.post summary::-webkit-details-marker { display: none; }
details.post summary .titel { flex: 1 1 300px; font-weight: 560; }
details.post .innehall { padding: 0 16px 14px; }
.ok-text { color: var(--gron); } .rod-text { color: var(--rod); }
.meddelande { padding: 12px 14px; border-radius: 10px; background: var(--gron-mjuk); color: var(--gron); margin: 12px 0; }
.meddelande.fel { background: var(--rod-mjuk); color: var(--rod); }
select, input[type=number], input[type=email] { font: inherit; color: inherit; background: var(--yta); border: 1px solid var(--linje); border-radius: 9px; padding: 8px 10px; }
button.chip { font: inherit; font-size: 12px; cursor: pointer; }
label.rad { gap: 6px; }
.varfor-rad { padding: 6px 0; border-bottom: 1px solid var(--linje); display: flex; gap: 10px; align-items: baseline; }
.varfor-rad .p { font-variant-numeric: tabular-nums; color: var(--rod); min-width: 36px; text-align: right; }
.varfor-rad .k { color: var(--dampad); font-size: 12px; min-width: 70px; }
/* Dokumentation och rapporter: flödesvyns kort, chips och poster; långa id:n och sökvägar bryts i mobilen */
.dok :is(code, a, li, p, dd, dt, summary .titel, .chip) { overflow-wrap: anywhere; }
.dok .chip { white-space: normal; }
.dok a.kort.siffra { display: block; text-decoration: none; color: inherit; }
.dok a.kort.siffra:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--linje)); }
.dok .siffra .etikett + .etikett { font-size: 12px; margin-top: 2px; }
.dok ul.lista { margin: 4px 0 0; padding-left: 18px; }
.dok ul.lista li { margin: 4px 0; }
.dokfilter { display: grid; gap: 10px 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); margin: 6px 0 10px; }
.dokfilter label:first-child { grid-column: 1 / -1; }
.dokfilter label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--dampad); }
.dokfilter :is(input, select) { width: 100%; min-width: 0; height: 38px; font: inherit; font-size: 14px; color: var(--text); background: var(--yta); border: 1px solid var(--linje); border-radius: 9px; padding: 6px 9px; }
dl.dokfalt { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr); gap: 5px 14px; margin: 6px 0 10px; font-size: 14px; }
dl.dokfalt dt { color: var(--dampad); }
dl.dokfalt dd { margin: 0; }
dl.dokfalt ul { margin: 0; padding-left: 18px; }
.stegrad { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 2px; }
.dok .kort + .kort:not(.siffra) { margin-top: 10px; }
.dok .not { font-size: 13px; color: var(--dampad); margin: 6px 0 0; }
@media (max-width: 560px) { dl.dokfalt { grid-template-columns: minmax(0, 1fr); gap: 0; } dl.dokfalt dd { margin-bottom: 8px; } .dokfilter label:nth-child(2) { grid-column: 1 / -1; } }
#kirurg-forbattring { overflow-wrap: anywhere; }
#kirurg-forbattring input, #kirurg-forbattring select { max-width: 100%; }
#kirurg-forbattring button { white-space: normal; min-height: 44px; margin: 8px 6px 8px 0; }
#kirurg-forbattring select { font: inherit; padding: 9px 11px; border: 1px solid var(--linje); border-radius: 9px; background: var(--yta); color: var(--text); }
#kirurg-forbattring form { max-width: 720px; }
#kirurg-forbattring summary { padding-block: 10px; cursor: pointer; }
</style>

<div id="rot"><p class="under" style="padding:28px 20px">Laddar …</p></div>
<dialog id="qr" aria-label="Sajten i telefonen"><form method="dialog" class="rad mellan"><b>Sajten i telefonen</b><button class="knapp">Stäng</button></form><div class="innehall"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (p) => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).fel || r.status); return r.json(); };
// Dashboardnyckeln: dashboard.sh öppnar sidan med #nyckel=…; den sparas i webbläsaren och följer varje skrivande anrop (X-Nyckel).
// Utan den nekar servern (403): en lokal process som bara sätter Origin kan inte skriva ägarens domar (backloggen 2026-10-05).
// &till=<vy> (dashboard.sh arbetsyta [kund]) väljer vyn efter att nyckeln sparats; nyckeln stannar aldrig i adressen
(() => { const m = location.hash.match(/^#nyckel=([A-Za-z0-9_-]{8,})(?:&till=([a-z0-9/-]{1,80}))?$/); if (m) { try { localStorage.setItem('nwp-dashboardnyckel', m[1]); } catch {} history.replaceState(null, '', location.pathname + location.search + (m[2] ? '#/' + m[2] : '')); } })();
const nyckel = () => { try { return localStorage.getItem('nwp-dashboardnyckel') || ''; } catch { return ''; } };
const post = async (p, body) => { const r = await fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Nyckel': nyckel() }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.fel || r.status); return j; };
const tid = (t) => t ? new Date(t).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' }) : '–';
const GRINDNAMN = { bygge: 'Bygge', seo: 'SEO', standard: 'Byggstandard', axe: 'Tillgänglighet (axe)', lighthouse: 'Lighthouse', spill: 'Spill', 'utan-js': 'Utan JS' };
const kopiera = (text, knapp) => { navigator.clipboard?.writeText(text); const t = knapp.textContent; knapp.textContent = 'Kopierat'; setTimeout(() => (knapp.textContent = t), 1400); };
const kommando = (text) => `<div class="kommando"><code>${esc(text)}</code><button class="knapp" onclick="kopiera(${esc(JSON.stringify(text))}, this)">Kopiera</button></div>`;
let timer = null, flik = 'oversikt';

function aktivNav(v) { document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('aktiv', a.dataset.v === v)); }
function raknare(o) {
  if (typeof arbetsytaRaknare === 'function') return arbetsytaRaknare(o);  // räknarna står i arbetsytans meny
  const b = $('#n-backlog'); if (b) { b.hidden = !o.backlog_vilande; b.textContent = o.backlog_vilande; }
  const k = $('#n-kirurg'); if (k) { k.hidden = !o.intag_pagar; k.textContent = o.intag_pagar ? o.intag_pagar + ' pågår' : ''; }
  const pr = $('#n-prospekt'); if (pr) { pr.hidden = !o.prospekt_vantar; pr.textContent = o.prospekt_vantar || ''; }
}
function grindchips(prov) {
  if (!prov) return '<span class="chip">Inte provad</span>';
  return Object.entries(prov.grindar).map(([n, ok]) => `<span class="chip ${ok ? 'ok' : 'rod'}">${esc(GRINDNAMN[n] || n)}</span>`).join('');
}
// leveransens visuella status ur beställningen (kontroller/bildstatus.py): bildmaterialet komplett (bara med beställningens
// uttryckliga besked; inget godkännande av formgivningen), visuellt begränsad av saknat material, eller okänd
const visuellchip = (b) => b.visuell && b.visuell.status ? `<span class="chip ${b.visuell.status === 'bildmaterialet komplett' ? '' : 'gul'}" title="${esc(b.visuell.text)}">${esc(b.visuell.status)}</span>` : '';
function statuschip(b) {
  if (b.pagar) return '<span class="chip acc puls">Körning pågår</span>';
  // avslutat är inte godkänt: stoppvakten släppte vid sitt tak (rött prov, saknad rapport eller underkänd granskning)
  const utan = b.slappt_utan_godkannande ? '<span class="chip rod">Avslutat utan godkännande</span>' : '';
  if (b.domd) return utan + '<span class="chip">Dömd</span>';
  if (b.prov && b.steg[6].klar) return utan + '<span class="chip gul">Väntar på din dom</span>';
  if (b.prov) return `<span class="chip ${b.prov.ok ? 'ok' : 'rod'}">${b.prov.ok ? 'Grönt' : 'Rött'}</span>`;
  return '<span class="chip">Påbörjad</span>';
}

// Verktygslådan: det dagliga underhållet prövar och tar in uppdateringar mellan byggena (kontroller/underhall.py)

  if (d.fel) { el.innerHTML = `<div class="meddelande fel">Underhållets läge kunde inte läsas: ${esc(d.fel)}. Ett nytt försök om en stund.</div>`; return; }
  const s = d.senast, a = (s && s.antal) || {};

      ${s && !d.pagar ? `<span class="chip ok">${a.uppdaterad || 0} uppdaterade</span><span class="chip ${a.avvisad ? 'rod' : ''}">${a.avvisad || 0} avvisade</span><span class="chip ${a.behallen ? 'gul' : ''}">${a.behallen || 0} behållna</span>` : ''}
      ${d.av ? '<span class="chip">automatiken är av (NWP_UNDERHALL_AV)</span>' : `<span class="chip">körs ${d.intervall_dagar === 1 ? 'en gång per dygn' : 'var ' + d.intervall_dagar + ' dygn'}, när inget bygge pågår</span>`}
      <button class="knapp" id="underhall-nu" ${d.pagar ? 'disabled' : ''}>Kör underhållet nu</button><span id="underhall-svar" class="under"></span></div>
    <p class="under">Claude Code, skillsen, sajtens paket, mätinstrumenten, Python-paketen, Homebrew-formlerna och Impeccables motor prövas var för sig i en isolerad kopia (huvudversioner och mätinstrument med hela rökprovet) och tas in när de klarar proven. Starterna bekräftar bara läget och låser versionerna i ett startkvitto.</p>
    ${bytta.length ? `<p class="under"><b>Bytta mätinstrument:</b> ${bytta.map((x) => `${esc(x.namn)} ${esc(x.fran || '')} → ${esc(x.till || '')} (${tid(x.tid)})`).join('; ')}</p>` : ''}
    ${d.md ? `<details><summary>Senaste underhållet (UNDERHALL.md)</summary><div class="prosa">${d.md}</div></details>` : ''}`;
  $('#underhall-nu').onclick = async () => { $('#underhall-nu').disabled = true; try { await post('/api/underhall/kor', {}); setTimeout(verktygsladavy, 1500); } catch (err) { $('#underhall-svar').innerHTML = `<span class="rod-text">${esc(err.message)}</span>`; $('#underhall-nu').disabled = false; } };
}
// kvittots resultat som chips, med kvittots egna ord (startkontroll.NAMN genom sammanfattningens ord): det som begränsar,
// det som är nytt och det som inte gäller starten var för sig (GR-20261007-r102#K2)
const STARTKVITTO_CHIPS = [['fel', 'rod'], ['avvisad', 'rod'], ['behallen', 'gul'], ['okand', 'gul'], ['delvis', 'gul'], ['nytt', 'gul'], ['ej_tillampligt', '']];
const startkvittoChips = (k) => STARTKVITTO_CHIPS.filter(([x]) => (k.antal || {})[x]).map(([x, f]) => `<span class="chip ${f}">${k.antal[x]} ${esc((k.ord || {})[x] || x)}</span>`).join('');
// Startkontrollens kvitto för kundens senaste start, överst i prototypvyn
function visaStartkvitto(d) {
  const k = d.startkvitto; if (!k) return;
  if (k.stopp) {  // en senare start stoppades; körningens eget kvitto står under
    const h1s = $('#vy h1'); if (h1s && !$('#startstopp')) { const sec = document.createElement('section'); sec.id = 'startstopp'; sec.className = 'kort'; sec.style.marginBottom = '12px';
      sec.innerHTML = `<div class="rad"><span class="chip rod">Startkontrollen stoppade starten ${tid(k.stopp.tid)}</span></div><p class="rod-text">${(k.stopp.stoppar || []).map(esc).join('<br>')}</p>${k.stopp.md ? `<details><summary>Kvittot för den stoppade starten</summary><div class="prosa">${k.stopp.md}</div></details>` : ''}`;
      h1s.insertAdjacentElement('afterend', sec); }
    if (!k.status) return;
  }
  const h1 = $('#vy h1'); if (!h1 || $('#startkvitto')) return;
  const etikett = { redo: ['ok', 'Startkontrollen: redo'], begransad: ['gul', 'Startkontrollen: redo med begränsningar'], stoppad: ['rod', 'Startkontrollen stoppade starten'] }[k.status] || ['', 'Startkontrollen'];
  const sec = document.createElement('section'); sec.id = 'startkvitto'; sec.className = 'kort'; sec.style.marginBottom = '18px';
  sec.innerHTML = `<div class="rad" style="flex-wrap:wrap"><span class="chip ${etikett[0]}">${etikett[1]}</span><span class="chip">${tid(k.tid)} · ${esc(k.start || '')}</span>
      ${startkvittoChips(k)}
      ${(k.matinstrument_bytta || []).length ? `<span class="chip gul">mätinstrument bytta: ${k.matinstrument_bytta.map((x) => esc(x.namn)).join(', ')}</span>` : ''}</div>
    ${(k.stoppar || []).length ? `<p class="rod-text">${k.stoppar.map(esc).join('<br>')}</p>` : ''}
    ${d.startkontroll_stopp && k.stopp ? `<p class="under">Starten ${tid(d.startkontroll_stopp.tid)} gjordes inte; den förra körningens resultat och kvitto står kvar.</p>` : ''}
    ${k.md ? `<details><summary>Startkvittot (STARTKVITTO.md)</summary><div class="prosa">${k.md}</div></details>` : ''}`;
  h1.insertAdjacentElement('afterend', sec);
}

function kort(b) {
  return `<a class="kort bygge-kort" href="#/bygge/${esc(b.slug)}">
    <div class="rad mellan"><div><div class="namn">${esc(b.namn)}</div><div class="ort">${esc(b.ort || b.slug)}</div></div>${statuschip(b)}</div>
    <div class="steg">${b.steg.map((s) => `<i class="${s.klar ? 'klar' : ''}" title="${esc(s.namn)}"></i>`).join('')}</div>
    <div class="chips">${grindchips(b.prov)}${visuellchip(b)}</div></a>`;
}

async function byggevy(slug, behallFlik) {
  aktivNav('oversikt');
  const b = await api('/api/bygge/' + encodeURIComponent(slug));
  if (!behallFlik) flik = (!b.domd && b.steg[6].klar) ? 'dom' : 'oversikt';
  const flikar = [['oversikt', 'Översikt'], ['rapport', 'Rapport'], ['underlag', 'Underlag'], ['korning', 'Körning'], ['prov', 'Prov'], ['granskning', 'Granskning'], ['dom', b.domd ? 'Dom ✓' : 'Din dom']];
  $('#vy').innerHTML = `
    <p class="under" style="margin-bottom:6px"><a href="#/oversikt">Byggen och dina domar</a></p>
    <div class="rad mellan"><div><h1>${esc(b.namn)}</h1><div class="under" style="margin:0">${esc([b.ort, b.doman].filter(Boolean).join(' · ') || b.slug)}</div></div>
      <div class="rad">${statuschip(b)}${visuellchip(b)}
        ${b.steg[4].klar ? `<a class="knapp primar" href="/visa/${esc(b.slug)}" target="_blank" rel="noopener">Öppna vår sajt</a><button class="knapp" data-qr="${esc(b.slug)}">I telefonen</button>` : ''}
        ${b.doman ? `<a class="knapp" href="https://${esc(b.doman)}" target="_blank" rel="noopener">Deras sajt</a>` : ''}</div></div>
    <div class="steglista">${b.steg.map((s, i) => `<div class="${s.klar ? 'klar' : ''}">${i + 1}. ${esc(s.namn)}</div>`).join('')}</div>
    <div class="flikar">${flikar.map(([k, n]) => `<button class="${flik === k ? 'aktiv' : ''}" data-f="${k}">${esc(n)}</button>`).join('')}</div>
    <div id="flik"></div>`;
  document.querySelectorAll('.flikar button').forEach((x) => x.onclick = () => { flik = x.dataset.f; byggevy(slug, true); });
  const f = $('#flik');
  if (flik === 'oversikt') f.innerHTML = bOversikt(b);
  if (flik === 'rapport') f.innerHTML = b.rapport ? `<div class="prosa">${b.rapport}</div>` : '<div class="tom">Ingen rapport än.</div>';
  if (flik === 'underlag') f.innerHTML = bUnderlag(b);
  if (flik === 'korning') f.innerHTML = b.ab_dold ? '<div class="tom">Dolt tills du har valt i Jämförelser, så att jämförelsen förblir blind.</div>' : bKorning(b.korning);
  if (flik === 'prov') f.innerHTML = b.prov_md ? `<div class="prosa">${b.prov_md}</div>` : '<div class="tom">Provet har inte körts.</div>';
  if (flik === 'granskning') f.innerHTML = bGranskning(b.granskning || {});
  if (flik === 'dom') { if (b.ab_dold) f.innerHTML = '<div class="tom">Välj först blint i Jämförelser. Domen över varje arm öppnas när jämförelsen är avgjord, så att inget här avslöjar vilken arm som är vilken.</div>'; else bDom(b, f); }
  if (b.pagar && flik !== 'dom') timer = setTimeout(() => byggevy(slug, true), 6000);
}
function bild(p, text) { return p ? `<figure><a href="/fil/${esc(p)}" target="_blank"><img loading="lazy" src="/fil/${esc(p)}" alt="${esc(text)}"></a><figcaption>${esc(text)}</figcaption></figure>` : ''; }
function hitta(lista, sida, vy) { return lista.find((p) => p.includes(`/${sida}/vy-${vy}-`)) || lista.find((p) => p.includes(`vy-${vy}-`)); }
function bOversikt(b) {
  const v = b.bilder.var, d = b.bilder.deras;
  const rader = [['Prestanda (mobil)', 'prestanda'], ['Tillgänglighet (mobil)', 'tillganglighet'], ['Bästa praxis (mobil)', 'bastaPraxis'], ['SEO (mobil)', 'seo'], ['Allvarliga axe-fel', 'axe_allvarliga'], ['LCP, ms (mobil)', 'lcpMs']];
  const harFore = Object.keys(b.fore || {}).length, harEfter = Object.keys(b.efter || {}).length;
  return `
    <h2 style="margin-top:0">Vår sajt</h2>
    ${v.length ? `<div class="bilder">${bild(hitta(v, 'hem', 390), 'Startsidan, mobil 390')}${bild(hitta(v, 'hem', 1440), 'Startsidan, desktop 1440')}</div>` : '<div class="tom">Inga skärmbilder än.</div>'}
    ${d.length ? `<h2>Deras nuvarande sajt</h2><div class="bilder">${bild(hitta(d, '', 390), 'Deras startsida, mobil')}${bild(hitta(d, '', 1440), 'Deras startsida, desktop')}</div>` : ''}
    ${harFore || harEfter ? `<h2>Före och efter</h2><div class="kort tabell"><table><thead><tr><th></th><th class="tal">Deras</th><th class="tal">Vår</th></tr></thead><tbody>

    ${b.stoppvakt ? `<p class="under" style="margin-top:10px">Stoppvakten: ${esc(b.stoppvakt.skal)} (försök ${b.stoppvakt.forsok} av ${b.stoppvakt.tak}).</p>` : ''}
    ${v.length > 2 ? `<h2>Alla sidor</h2><div class="galleri">${v.map((p) => bild(p, p.split('/inspektion/')[1])).join('')}</div>` : ''}
    ${b.bilder.referenser.length ? `<h2>Referenserna bygget valde</h2><div class="galleri">${b.bilder.referenser.map((p) => bild(p, p.split('/referenser/')[1])).join('')}</div>` : ''}`;

function bGranskning(g) {
  if (!g.finns) return '<div class="tom">Ingen oberoende granskning än. Bygget kör kontroller/granska.py efter designsteget, och stoppvakten kör den innan bygget får avslutas.</div>';
  if (g.dold) return `<div class="tom">Granskaren har dömt bygget (${g.rundor} omgång${g.rundor === 1 ? '' : 'ar'}). Domen visas efter din dom, så att du dömer oberoende och vi kan se hur ofta ni är överens.</div>`;
  return `<div class="rad" style="margin-bottom:12px"><span class="chip ${g.godkand ? 'ok' : 'rod'}">${g.godkand ? 'Godkänd' : 'Underkänd'}</span><span class="chip">omgång ${g.runda} av ${g.rundor}</span></div><div class="prosa">${g.html}</div>`;
}

function bKorning(k) {

      <span class="chip">${k.antal_handlingar} handlingar</span>${k.resultat ? `<span class="chip">${k.resultat.turer} turer · ${k.resultat.minuter} min</span>` : ''}

    <p class="under" style="margin-top:12px">Logg: <code>${esc(k.logg)}</code></p>`;

function falt(q) {
  const id = esc(q.id), varfor = q.varfor ? `<span class="varfor">${esc(q.varfor)}</span>` : '';
  // bild är en sökväg, eller en lista med en bild per alternativ i samma ordning (riktningsfrågan: byggd och tvåan)
  const vag = (p) => '/fil/' + esc(p.startsWith('underlag/') || p.startsWith('kunder/') ? p : 'kunder/' + window._slug + '/' + p);
  const bilder = (Array.isArray(q.bild) ? q.bild : [q.bild]).filter((p) => typeof p === 'string' && p);
  const bildHtml = bilder.length > 1
    ? `<div class="alt-bilder">${bilder.map((p, i) => `<figure><a href="${vag(p)}" target="_blank"><img loading="lazy" src="${vag(p)}" alt="${esc((q.alternativ || [])[i] || '')}"></a><figcaption>${esc((q.alternativ || [])[i] || '')}</figcaption></figure>`).join('')}</div>`
    : bilder.length ? `<img src="${vag(bilder[0])}" alt="">` : '';
  if (q.typ === 'val') return `<div class="fraga"><div class="q">${esc(q.fraga)}${varfor}</div>${bildHtml}<div class="val">${(q.alternativ || []).map((a) => `<label><input type="radio" name="${id}" value="${esc(a)}"><span>${esc(a)}</span></label>`).join('')}</div>${q.foljd ? `<textarea name="${id}__foljd" placeholder="${esc(q.foljd)}" style="margin-top:10px;min-height:56px"></textarea>` : ''}</div>`;
  if (q.typ === 'skala') { const n = q.steg || 5; return `<div class="fraga"><div class="q">${esc(q.fraga)}${varfor}</div>${bildHtml}<div class="skala"><small>${esc(q.min || '')}</small><div class="val">${Array.from({ length: n }, (_, i) => `<label><input type="radio" name="${id}" value="${i + 1}"><span>${i + 1}</span></label>`).join('')}</div><small>${esc(q.max || '')}</small></div></div>`; }
  if (q.typ === 'matris') return `<div class="fraga"><div class="q">${esc(q.fraga)}${varfor}</div><div class="tabell"><table class="matris"><thead><tr><th></th>${q.alternativ.map((a) => `<th>${esc(a)}</th>`).join('')}</tr></thead><tbody>${q.rader.map((r) => `<tr><td>${esc(r)}</td>${q.alternativ.map((a) => `<td><div class="val cell"><label><input type="radio" name="${id}::${esc(r)}" value="${esc(a)}" aria-label="${esc(r)}: ${esc(a)}"><span>${esc(a)}</span></label></div></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return `<div class="fraga"><label for="f-${id}">${esc(q.fraga)}${varfor}</label>${bildHtml}<textarea id="f-${id}" name="${id}"></textarea></div>`;
}
function bDom(b, f) {
  window._slug = b.slug;
  const startad = new Date().toISOString();  // ägarens minuter till domen (kontroller/autonomi.py)
  const tidigare = (b.domar || []).map((d) => `<details class="post"><summary><span class="titel">Dom ${tid(d.tid)}</span><span class="chip">${esc(d.svar.namn || '')}</span></summary><div class="innehall"><table>${Object.entries(d.svar).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(typeof v === 'object' ? Object.entries(v).map(([a, c]) => a + ': ' + c).join(', ') : v)}</td></tr>`).join('')}</table></div></details>`).join('');
  f.innerHTML = `
    ${tidigare ? `<h2 style="margin-top:0">Tidigare domar</h2>${tidigare}` : ''}
    <h2 ${tidigare ? '' : 'style="margin-top:0"'}>${b.domd ? 'Döm igen' : 'Din dom'}</h2>
    <p class="under">Titta på sajten först (Öppna vår sajt), och i telefonen (I telefonen). Svaren sparas ordagrant i underlag/LARDOMAR-original.md (privat, utanför git), som betyg utan personuppgifter i LARDOMAR.md, och blir en vilande post i backloggen. Hoppa över det du inte har en åsikt om.</p>
    <form id="domform" class="kort">
      ${b.fragor.karna.map(falt).join('')}
      ${b.fragor.egna.length ? `<h3 style="margin-top:22px">Byggets egna frågor</h3><p class="under" style="margin:0">Det bygget själv var mest osäkert på.</p>${b.fragor.egna.map(falt).join('')}` : ''}
      <div class="rad" style="margin-top:18px"><button class="knapp primar" type="submit">Skicka domen</button><span id="domsvar"></span></div>
    </form>`;
  $('#domform').onsubmit = async (e) => {
    e.preventDefault();
    const svar = {};
    for (const [k, v] of new FormData(e.target).entries()) {
      if (!String(v).trim()) continue;
      if (k.includes('::')) { const [id, rad] = k.split('::'); (svar[id] ||= {})[rad] = v; }
      else if (k.endsWith('__foljd')) svar[k.slice(0, -7) + '_exempel'] = v;
      else svar[k] = v;
    }
    if (!Object.keys(svar).length) { $('#domsvar').innerHTML = '<span class="rod-text">Svara på minst en fråga.</span>'; return; }
    e.target.querySelector('button').disabled = true;
    try {

// Sammanfattningen kapas vid ett meningsslut, aldrig mitt i ett ord; resten under Visa mer. Spanaren sparar högst
// 600 tecken: slutar texten där utan skiljetecken markeras det med … (ägaren 2026-10-03: "texten blir avkapad").
function sammanfattning(s) {
  let t = String(s || '').trim();
  if (t.length >= 590 && !/[.!?…)"”']$/.test(t)) t = t.replace(/\s+\S*$/, '') + ' …';
  if (t.length <= 340) return esc(t);
  const m = t.slice(0, 340).match(/^[\s\S]*[.!?](?=\s)/);
  const forsta = m ? m[0] : t.slice(0, 340).replace(/\s+\S*$/, '');
  const rest = t.slice(forsta.length).trim();
  return `${esc(forsta)}${m ? '' : ' …'} <details class="mer"><summary>Visa mer</summary>${esc(rest)}</details>`;
}

    const spara = () => { try { localStorage.setItem(utkastNyckel(e.id), JSON.stringify({ niva: (document.querySelector(`input[name="niva-${e.id}"]:checked`) || {}).value || '', skiljer: ta.value })); } catch {} };

    document.querySelectorAll(`input[name="niva-${e.id}"]`).forEach((r) => r.addEventListener('change', spara));
  }
  document.querySelectorAll('[data-kal]').forEach((k) => k.onclick = async () => {
    const id = k.dataset.kal; const niva = (document.querySelector(`input[name="niva-${id}"]:checked`) || {}).value;
    if (!niva) { alert('Välj nivå först.'); return; }
    k.disabled = true;
    try { await post('/api/kalibrering/' + encodeURIComponent(id), { niva, skiljer: $('#sk-' + id).value }); try { localStorage.removeItem(utkastNyckel(id)); } catch {} kalibreringvy(); } catch (e) { alert(e.message); k.disabled = false; }
  });
}

// Designprov: ägaren dömer ateljéns förslag blint, bredvid huvudreferensen (designprovet, ägarbeslut 2026-10-04)

         <div class="rad" style="margin-top:6px;flex-wrap:wrap;gap:12px">${Object.keys(NIVA).map((n) => `<label><input type="radio" name="dp-n-${k}" value="${n}"> ${NIVA[n]}</label>`).join('')}</div>
         <textarea id="dp-sk-${k}" rows="3" style="width:100%;margin-top:8px" placeholder="Vad skiljer? Bildval, beskärning, typografiska proportioner, komposition, rytm, detaljarbete; och hur nära huvudreferensen det är."></textarea>

    return `<section class="kort" style="margin-bottom:24px"><h2>Förslag ${esc(f.bokstav)}</h2>

      <details><summary>Hela startsidan (390 och 1440)</summary><div class="galleri" style="grid-template-columns:1fr 2fr">${bild(b['390-hela'], 'hela sidan 390')}${bild(b['1440-hela'], 'hela sidan 1440')}</div></details>
      <details><summary>Början av en undersida</summary><div class="galleri" style="grid-template-columns:1fr 2fr">${bild(b['undersida-390'], 'undersida 390')}${bild(b['undersida-1440'], 'undersida 1440')}</div></details>${form}</section>`;
  };
  const avsl = (r) => r.avslojat ? `<section class="kort"><h2>Avslöjat · omgång ${esc(String(r.nummer))}</h2><p class="under">${Object.entries(r.avslojat.karta).map(([b, n]) => `${esc(b)} = riktning ${esc(String(n))}`).join(' · ')} · panelens val: ${r.avslojat.panel_saknas ? '<b>panelen dömde inte</b>' : r.avslojat.panelens_val == null ? '<b>alla förkastade</b>' : 'riktning ' + esc(String(r.avslojat.panelens_val))}</p><div class="prosa">${r.avslojat.val_md}</div></section>` : '';

  });
}

// Prototypen: skapandeflödets startsida (kunskap/skapandeflodet.md). Riktningarna som prövades, före och efter förfiningen

// visas först när ägaren dömt, så att domen är oberoende.
const BESLUT = { godkand: 'Godkänd: bygget tar vid från den här startsidan', putsa: 'Putsa vidare: samma riktning, med min kritik', ny_riktning: 'Ny riktning: designbesluten raderas (inget arkiv) och utforskningen börjar om' };
async function prototypvy(slug) {
  aktivNav('prototyp');
  if (!slug) {
    const lista = await api('/api/prototyp');
    if (lista.length === 1) { location.hash = '#/prototyp/' + encodeURIComponent(lista[0]); return; }
    $('#vy').innerHTML = `<h1>Prototyp</h1><p class="under">Startsidor ur skapandeflödet: skilda förslag, ditt val, fördjupningen och godkännandet.</p>${lista.map((s) => `<p><a href="#/prototyp/${esc(s)}">${esc(s)}</a></p>`).join('') || '<p>Ingen körning än.</p>'}`;
    return;
  }
  const d = await api('/api/prototyp/' + encodeURIComponent(slug));
  if (d.kandidatflode) { await kandidatvy(slug, d); return visaStartkvitto(d); }
  const startad = new Date().toISOString();  // ägarens minuter till domen (kontroller/autonomi.py)
  const hr = d.huvudreferens;
  const ref = hr ? `<section class="kort" style="margin-bottom:24px"><h2>Huvudreferensen: ${esc(hr.namn)}</h2><p class="under">${esc(hr.vad)}</p><div class="galleri">${hr.bilder.map((b) => bild(b.fil, b.text)).join('')}</div></section>` : '';
  const kol = (rubrik, b) => `<div><h3>${rubrik}</h3><div class="galleri" style="grid-template-columns:1fr 2fr">${bild(b['390-forsta'], 'mobil 390, första vyn')}${bild(b['1440-forsta'], 'dator 1440, första vyn')}</div>
      <details><summary>Hela sidan (390 och 1440)</summary><div class="galleri" style="grid-template-columns:1fr 2fr">${bild(b['390-hela'], 'hela sidan 390')}${bild(b['1440-hela'], 'hela sidan 1440')}</div></details></div>`;
  const klar = ['klar', 'forkastad', 'tillbaka'].includes(d.steg);
  const lage = d.steg === 'klar' ? `Klar ${tid(d.klar)} (läge ${esc(d.lage || '')}, ${esc(String(d.omgangar || 1))} omgång${d.omgangar > 1 ? 'ar' : ''}).`
    : d.steg === 'fel' ? `Körningen föll: ${esc(d.fel || '')}` : d.steg === 'forkastad' || d.steg === 'tillbaka' ? `Ingen startsida att döma: ${esc(d.skal || d.steg)}`
    : `Pågår (steg ${esc(d.steg || '')}, startad ${tid(d.startad)}).`;
  const riktn = (d.riktningar || []).length ? `<details style="margin-top:24px"${d.steg === 'forkastad' ? ' open' : ''}><summary>Riktningarna som prövades (${d.riktningar.length})</summary><div class="galleri" style="grid-template-columns:repeat(${Math.min(d.riktningar.length, 3)},1fr);gap:18px">${d.riktningar.map((r) => `<div><h3>${esc(r.namn)}${r.vald ? ' · vald' : ''}</h3><p class="under">${r.referens ? 'bygger på ' + esc(r.referens) : 'ingen huvudreferens'}</p><div class="galleri" style="grid-template-columns:1fr 2fr">${bild(r.bilder['390-forsta'], 'mobil')}${bild(r.bilder['1440-forsta'], 'dator')}</div></div>`).join('')}</div></details>` : '';
  const tidigare = (d.domar || []).map((x) => `<p class="under">${tid(x.tid)} · ${esc(x.kalla)} · <b>${esc((BESLUT[x.beslut] || x.beslut).split(':')[0])}</b>${x.niva ? ' · ' + esc(NIVA[x.niva] || x.niva) : ''}: ${esc(String(x.text || '').slice(0, 400))}${String(x.text || '').length > 400 ? '…' : ''}</p>`).join('');
  const form = klar ? `<section class="kort" style="margin-top:24px"><h2>${d.domd ? 'Döm igen' : 'Din dom'}</h2>
      <p class="under">Domen sparas i domloggen och läses av nästa körning: putsa vidare förfinar samma riktning med din text som kritik, ny riktning raderar designbesluten, ateljén och hela sajten, också en godkänd och helbyggd (inget arkiv; fakta, texten, domloggen, historiken, dina egna omdömen och leveransen står kvar) och börjar om med en ny utforskning, godkänd lämnar över till bygget.</p>
      <div style="margin-top:10px">${Object.keys(BESLUT).filter((b) => b !== 'godkand' || d.steg === 'klar').map((b) => `<div><label><input type="radio" name="pr-b" value="${b}"> ${esc(BESLUT[b])}</label></div>`).join('')}</div>
      <div class="rad" style="margin-top:8px;flex-wrap:wrap;gap:12px"><span class="under">Nivå (valfritt):</span>${Object.keys(NIVA).map((n) => `<label><input type="radio" name="pr-n" value="${n}"> ${NIVA[n]}</label>`).join('')}</div>
      <textarea id="pr-text" rows="5" style="width:100%;margin-top:8px" placeholder="Vad håller inte, och vad ska nästa försök pröva? Rubriker, bildval, beskärning, proportioner, mobilens komposition, färg, typografi. Dina ord följer med ordagrant."></textarea>
      <div class="rad" style="margin-top:8px"><button class="knapp primar" id="pr-spara">Spara domen</button></div>
      ${tidigare ? `<details style="margin-top:12px"><summary>Domloggen (${d.domar.length})</summary>${tidigare}</details>` : ''}</section>`
    : (tidigare ? `<details style="margin-top:24px"><summary>Domloggen (${d.domar.length})</summary>${tidigare}</details>` : '');
  const efter = d.domd ? `${d.val_md ? `<details style="margin-top:24px"><summary>Panelens val (VAL.md)</summary><div class="prosa">${d.val_md}</div></details>` : ''}
    ${d.slutdom_md ? `<details><summary>Slutdomen: före mot efter (SLUTDOM.md)</summary><div class="prosa">${d.slutdom_md}</div></details>` : ''}
    ${d.redovisning_md ? `<details><summary>Vad körningen använde (REDOVISNING.md)</summary><div class="prosa">${d.redovisning_md}</div></details>` : ''}`
    : (klar ? '<p class="under" style="margin-top:16px">Panelens val och slutdom, förfiningens logg och redovisningen ur körspåret visas när du har dömt.</p>' : '');
  $('#vy').innerHTML = `<h1>Prototyp · ${esc(slug)}</h1><p class="under">${lage} ${d.godkand ? `<b>Godkänd ${tid(d.godkand.tid)}</b>; bygget tar vid från den.` : 'Döm efter-bilderna mot huvudreferensen; före är startsidan som panelen valde, innan förfiningen.'}</p>${ref}
    ${Object.keys(d.efter || {}).length ? `<section class="kort"><div class="galleri" style="grid-template-columns:1fr 1fr;gap:24px">${kol('Före · panelens val', d.fore || {})}${kol('Efter · förfinad', d.efter || {})}</div></section>` : ''}
    ${riktn}${form}${efter}
    ${d.riktningar_md ? `<details style="margin-top:24px"><summary>Riktningarna (RIKTNINGAR.md)</summary><div class="prosa">${d.riktningar_md}</div></details>` : ''}
    ${d.forfining_md ? `<details><summary>Förfiningens varv (FORFINING.md)</summary><div class="prosa">${d.forfining_md}</div></details>` : ''}`;
  visaStartkvitto(d);
  const knapp = $('#pr-spara');
  if (knapp) knapp.onclick = async () => {
    const b = (document.querySelector('input[name="pr-b"]:checked') || {}).value;
    const n = (document.querySelector('input[name="pr-n"]:checked') || {}).value;
    const text = $('#pr-text').value;
    if (!b) { alert('Välj godkänd, putsa vidare eller ny riktning.'); return; }
    if (b !== 'godkand' && !text.trim()) { alert('Skriv vad som ska ändras: din text är nästa körnings kritik.'); return; }
    knapp.disabled = true;
    try { await post('/api/prototyp/' + encodeURIComponent(slug), { beslut: b, niva: n || null, text, startad }); prototypvy(slug); } catch (e) { alert(e.message); knapp.disabled = false; }
  };
}

// Kandidatflödet (ägarens uppdrag 2026-10-05, punkt 10, och 2026-10-06, punkt 8): alla förslag med neutrala etiketter
// och lika stora bilder, mobil och dator bredvid varandra eller en bredd i taget; bilderna öppnas i full storlek och hela
// prototypen klickbar; markerade förslag sida vid sida; beslutet till domloggen, bundet till kandidat och version. Ägaren
// bedömer bilderna först, sedan referensen bredvid och sist redovisningen: jämförelsen och skaparens korta redovisning står
// hopfällda efter bilderna, de tekniska kontrollerna för sig. Panelens granskning och planens titlar efter första beslutet.
const KBESLUT = {
  valj: 'Välj för vidareutveckling: de markerade förfinas, var för sig, med din text och det du gillade',
  jamfor: 'Jämför vidare: spara de markerade som din jämförelse (inget körs)',
  putsa: 'Putsa vidare: de markerade förfinade förfinas igen med din text',
  godkand: 'Godkänn för helbygge: den markerade förfinade kandidaten blir sajtens grund',
  forkasta: 'Förkasta alla: inget av förslagen håller (inget körs förrän du ber om en ny riktning)',
  ny_riktning: 'Be om en ny riktning: förslagen och sajten raderas (förslagen står i historiken med din dom) och en ny utforskning börjar med din text',
};
const KVISBARA = ['klar', 'vald', 'jamfors', 'forkastad', 'forfinad', 'godkand'];
const KCHIP = { klar: 'acc', vald: 'ok', jamfors: 'acc', forfinad: 'ok', godkand: 'ok', forkastad: 'rod', ofullstandig: 'gul', fel: 'rod', avbruten: 'gul' };
const KBREDDER = { par: 'Mobil och dator', 390: 'Mobil 390', 768: 'Surfplatta 768', 1280: 'Mellanbredd 1280', 1440: 'Dator 1440' };
// mobil och dator är förvalet (ägarens uppdrag 2026-10-06, punkt 8); en ny nyckel, så att ett äldre sparat val inte styr
let kBredd = (() => { try { return localStorage.getItem('kandidat-visning') || 'par'; } catch (e) { return 'par'; } })();
let kHela = false;
// skaparens korta redovisning: RIKTNING.md:s rubriker (kontroller/kandidater.py, REDOVISNINGSRUBRIKER) med ägarens ord
const KREDOVISNING = { 'Idén': 'Idén och relevansen för kunden', 'Referenser': 'De faktiska referenserna',
  'Överfört och avvikelser': 'Det som synligt förts över, och avvikelserna', 'Kvarvarande svagheter': 'De viktigaste kvarvarande svagheterna' };
const KPASS = { skapa: 'Skaparen: design och komposition, typografi och färg, innehåll och UX, responsiv implementation', rorelse: 'Interaktion och rörelse', granskning: 'Tillgänglighet och visuell granskning', ux: 'UX och innehåll', mobil: 'Mobil och tillgänglighet', kritik: 'Visuell kritik och slutbearbetning' };
const OMDOME = { battre: 'bättre', oforandrad: 'oförändrad', samre: '<span class="rod-text">sämre</span>', ej_bedomd: 'ej bedömd' };
const kLage = {};  // markeringar och anteckningar per bygge, kvar när bredden byts (inte sparade: beslutet sparas i domloggen)
async function kandidatvy(slug, d) {
  const startad = new Date().toISOString();
  const alla = d.kandidater || [];
  const visbara = alla.filter((k) => KVISBARA.includes(k.status));
  const ovriga = alla.filter((k) => !KVISBARA.includes(k.status));
  const ks = kLage[slug] || (kLage[slug] = { markerade: new Set(visbara.filter((k) => d.fas === 'forfining' && k.status === 'forfinad').map((k) => k.id)), delar: {}, fore: new Set(), oppna: new Set() });
  const markerade = ks.markerade, delar = ks.delar, foreval = ks.fore;  // foreval: kandidater där ägaren väljer versionen före förbättringen
  const klara = d.steg === 'klar_for_bedomning' || d.steg === 'fel';
  const forfinade = visbara.some((k) => k.status === 'forfinad');
  // mellanbredden 1280 visas när den har fotograferats
  const bredder = ['par', '390', '768', ...(visbara.some((k) => k.bilder['1280-forsta'] || k.bilder['1280-hela']) ? ['1280'] : []), '1440'];
  if (!bredder.includes(kBredd)) kBredd = 'par';
  const vynamn = kHela ? 'hela sidan' : 'första vyn';
  const bildFor = (k, bredd, hela) => k.bilder[`${bredd}-${hela ? 'hela' : 'forsta'}`];
  const ramFor = (p, bredd, hela, alt) => p ? `<a class="kram v${bredd}${hela ? ' hela' : ''}" href="/fil/${esc(p)}" target="_blank" rel="noopener" title="Öppna i full storlek"><img loading="lazy" src="/fil/${esc(p)}" alt="${esc(alt)}"></a>` : `<div class="kram v${bredd} tom">ingen bild i ${bredd} px</div>`;
  const ram = (k, bredd, hela) => ramFor(bildFor(k, bredd, hela), bredd, hela, `${k.etikett}, ${bredd} px, ${hela ? 'hela sidan' : 'första vyn'}`);
  const fig = (k, bredd) => `<figure class="kfig">${ram(k, bredd, kHela)}<figcaption>${esc(KBREDDER[bredd])}, ${vynamn}</figcaption></figure>`;
  const bilderna = (k) => kBredd === 'par' ? `<div class="kpar">${fig(k, '390')}${fig(k, '1440')}</div>` : fig(k, kBredd);
  const fullstorlek = (k) => { const l = ['390', '768', '1280', '1440'].map((b) => [b, bildFor(k, b, kHela)]).filter(([, p]) => p);
    return l.length ? `<span class="under" style="margin:0">Full storlek, ${vynamn}: ${l.map(([b, p]) => `<a href="/fil/${esc(p)}" target="_blank" rel="noopener">${b}</a>`).join(' · ')}</span>` : ''; };
  const oppna = (k) => k.bygd ? `<a class="knapp" href="/visa/${esc(slug)}/${esc(k.id)}" target="_blank" rel="noopener">Öppna prototypen</a>${(k.undersidor || []).slice(0, 2).map((u) => `<a class="knapp" href="/visa/${esc(slug)}/${esc(k.id)}?sida=${encodeURIComponent(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('')}` : '';
  const oppen = (nyckel) => `data-oppen="${esc(nyckel)}"${ks.oppna.has(nyckel) ? ' open' : ''}`;  // hopfällt tills ägaren öppnar; står kvar öppet när vyn ritas om
  const forklaring = (k) => !d.domd ? '' : `<details class="kdel" ${oppen('fork-' + k.id)}><summary>${esc(k.titel || 'Planen')}${k.kritik ? ' · granskningen' : ''} · skaparens anteckningar</summary>
      ${k.kritik ? `<p class="under" style="margin:8px 0">Granskningen, ett internt betyg och inget godkännande (rådgivande, ${esc(k.kritik.modell || '')}${k.kritik.last === false ? ', läste inte bilderna' : k.kritik.last !== true ? ', läsningen ej prövad' : ''}${k.kritik.version && k.kritik.version !== k.version ? `, gäller version ${esc(String(k.kritik.version).slice(0, 12))} före ${k.status === 'forfinad' || k.status === 'godkand' ? 'förfiningen' : 'den nuvarande'}` : ''}): <b>${esc(NIVA[k.kritik.niva] || k.kritik.niva || '')}</b>. ${esc(k.kritik.helhet || '')}</p>
        ${k.kritik.uppgift ? `<p class="under">Besökarens uppgift: ${esc(k.kritik.uppgift.uppgift || '')} · går att genomföra: <b>${esc(k.kritik.uppgift.kan_genomforas || '')}</b>. ${esc(k.kritik.uppgift.belagg || '')}</p>` : ''}
        ${(k.kritik.avvikelser || []).length ? `<ul>${k.kritik.avvikelser.map((a) => `<li><b>${esc(a.allvar)}</b> · ${esc(a.slag || '')} · ${esc(a.var)}: ${esc(a.vad)} → ${esc(a.atgard)}${a.avsiktlig ? ` <i>(avsiktligt${a.valgrundad ? ', välgrundat' : ', illa grundat'}: ${esc(a.motivering || '')})</i>` : ''}</li>`).join('')}</ul>` : ''}` : ''}
      ${k.forbattring ? `<div class="kort" style="margin:10px 0;padding:10px"><b>Före granskningens förbättring</b> (rättade: ${esc((k.forbattring.atgarder || []).join('; ') || '–')})
        <div class="galleri" style="grid-template-columns:1fr 1fr;margin-top:8px">${bild(k.forbattring.bilder['390-forsta'], 'före, 390')}${bild(k.bilder['390-forsta'], 'efter, 390')}</div>
        <div class="rad" style="margin-top:6px">${['fore', 'efter', 'lika'].map((v) => `<button class="knapp" data-forb="${esc(k.id)}" data-val="${v}">${{ fore: 'Föreversionen bättre', efter: 'Förbättringen bättre', lika: 'Lika' }[v]}</button>`).join('')}</div>
        <label class="rad" style="margin-top:6px"><input type="checkbox" data-foreval="${esc(k.id)}"${foreval.has(k.id) ? ' checked' : ''}> Mitt beslut gäller föreversionen</label></div>` : ''}
      ${k.skisskritik ? `<div class="kort" style="margin:10px 0;padding:10px"><b>Den interna granskningen</b> (rådgivande; såg bara bilderna${k.skisskritik.varv ? ', varv ' + esc(k.skisskritik.varv) : ''})
        ${k.skisskritik.gjord ? `<p class="under">Största problemet: ${esc(k.skisskritik.storsta_problem || '')}</p>${(k.skisskritik.synliga_problem || []).length ? `<ul>${k.skisskritik.synliga_problem.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
          <p class="under">Generisk: ${k.skisskritik.generiskt ? 'ja' : 'nej'} · rekommendation: <b>${esc(k.skisskritik.rekommendation || '')}</b>${k.skisskritik.motivering ? ' — ' + esc(k.skisskritik.motivering) : ''}</p>
          <p class="under">Skaparens svar står under "Svar på granskningen" i RIKTNING.md nedan.${k.skisskritik.aterstallt ? ' Svaret blev inte klart eller bröt skissen (' + esc(k.skisskritik.svarets_skal || '') + '); skissen från före svaret visas.' : ''}</p>`
        : `<p class="under">${k.skisskritik.status === 'historisk' ? 'Historisk granskning' : 'Granskning inte verifierad'}: ${esc(k.skisskritik.skal || 'skälet är inte observerat')}.</p>`}</div>` : ''}
      ${(k.referensbilder || []).length ? `<p class="under" style="margin-bottom:4px">Huvudreferensens bilder ur uppdraget:</p><div class="galleri">${k.referensbilder.map((p) => bild(p, 'referensen')).join('')}</div>` : ''}
      ${k.material ? `<p class="under">Material som saknas: ${esc(k.material)}</p>` : ''}
      ${(k.kompetens || []).length ? `<div class="kort" style="margin:10px 0;padding:10px"><b>Kompetensernas arbete</b>${k.kompetens.map((r) => `<div style="margin-top:8px"><p class="under"><b>${esc(KPASS[r.pass] || r.pass)}</b>${r.nyckel && !r.nyckel.startsWith('skiss:') ? ' (fördjupningen)' : ''} · ${r.nyckel && r.nyckel.startsWith('skiss:') ? ((r.karnan_last ?? r.genomford) === true ? 'kärnan läst hel i varje session (tillämpningen inte observerad)' + (r.karnan_fore_andring === false ? ' · <span class="rod-text">men inte före första ändringen i varje session</span>' : '') : (r.karnan_last ?? r.genomford) === false ? '<span class="rod-text">kärnan inte läst hel i varje session</span>' : 'ej verifierat (inte observerat)') : r.genomford === true ? 'genomfört (beteendena prövade med bilder)' : r.genomford === false ? '<span class="rod-text">ej genomfört</span>' : 'ej verifierat'} · kärnan läst hel ${((r.kvitto || {}).lasta || []).length} av ${((r.kvitto || {}).lasta || []).length + ((r.kvitto || {}).saknas || []).length}${(r.kvitto || {}).ofullstandig ? ` · <span class="rod-text">ofullständig observation: ${esc(String((r.kvitto.sessioner || {}).sedda ?? '?'))} av ${esc(String((r.kvitto.sessioner || {}).forvantade ?? '?'))} sessioner har transkript</span>` : ''}${((r.kvitto || {}).per_session || []).filter((p) => (p.saknas || []).length).map((p) => ` · <span class="rod-text">session ${esc(String(p.session).slice(0, 8))} saknar ${esc(String(p.saknas.length))} kärnfiler</span>`).join('')}${Object.keys((r.kvitto || {}).mcp_utfall || {}).length ? ' · MCP: ' + esc(Object.entries(r.kvitto.mcp_utfall).map(([n, u]) => n.split('__').slice(1).join('/') + ' ' + Object.entries(u).map(([k, v]) => k + ' ×' + v).join(', ')).join('; ')) : ''}${((r.kvitto || {}).valda || []).length ? ' · valda alternativ: ' + esc(r.kvitto.valda.map((f) => f.split('/').slice(-2).join('/')).join(', ')) : ''}${r.aterstalld ? ' · återställt: ' + esc(r.aterstalld) : ''}</p><p class="under"><b>Kod ändrad:</b> ${r.andrad ? 'ja' : 'nej'} (versionerna); ändringarna nedan är sessionens egen redovisning, inte observerade</p>${(r.andringar || []).length ? `<ul>${r.andringar.slice(0, 8).map((a) => `<li>${esc(a.skill)}: ${esc(a.vad)} (${esc(a.var)}) — ${esc(a.varfor)}</li>`).join('')}</ul>` : `<p class="under">${esc(r.ingen_andring || '')}</p>`}${(r.beteende_provat || []).length ? `<p class="under"><b>Beteende prövat:</b></p><ul>${r.beteende_provat.slice(0, 8).map((b) => `<li>${esc(b.vad)}: ${esc(b.resultat)} (${esc(b.hur)})${b.bild_finns === false ? ' <span class="rod-text">bilden saknas</span>' : ''}</li>`).join('')}</ul>` : ''}${r.visuell_bedomning && r.visuell_bedomning.omdome ? `<p class="under"><b>Visuell bedömning, enligt sessionen (redovisad, inte observerad):</b> ${OMDOME[r.visuell_bedomning.omdome] || esc(r.visuell_bedomning.omdome)} — ${esc(r.visuell_bedomning.skal || '')}</p>` : ''}${(r.kvarstar || []).length ? `<p class="under">Kvarstår: ${esc(r.kvarstar.join('; '))}</p>` : ''}${((r.bilder || {}).fore || []).length ? `<div class="galleri" style="grid-template-columns:1fr 1fr">${bild(r.bilder.fore[0], 'före, 390')}${bild((r.bilder.efter || [])[0], 'efter, 390')}</div>` : ''}</div>`).join('')}</div>` : ''}
      ${k.riktning_html ? `<h4>Hela RIKTNING.md</h4><div class="prosa">${k.riktning_html}</div>` : ''}</details>`;
  // ägarens ordning (uppdraget 2026-10-06, punkt 8): bilderna först, sedan huvudreferensen bredvid förslaget i mobil och
  // dator, sist skaparens korta redovisning; båda hopfällda efter bilderna, för varje förslag
  const refjamfor = (k) => { const j = k.referensjamforelse;
    if (j && j.egen && !j.referens) return `<details class="kdel" ${oppen('ref-' + k.id)}><summary>Bredvid referensen: egen riktning</summary><p class="under">Förslaget är en egen riktning utan huvudreferens (skaparens val); det finns ingen referens att ställa bredvid.</p></details>`;
    if (!j || !j.referens) return `<details class="kdel" ${oppen('ref-' + k.id)}><summary>Bredvid referensen: jämförelsen saknas</summary><p class="under rod-text">${esc((j && j.saknas) || 'huvudreferensens sida hittades inte')}.</p></details>`;
    const r = j.referens;
    const vy = kHela ? 'hela' : 'forsta';
    // samma ramar som förslagets bilder: lika stora, och hela sidan i rullbara ramar
    const par = (bredd) => `<div class="kjref v${bredd}">${[[r[`${bredd}-${vy}`], 'Referensen'], [k.bilder[`${bredd}-${vy}`], 'Förslaget']].map(([p, t]) => `<figure class="kfig">${ramFor(p, bredd, kHela, `${t}, ${bredd} px, ${vynamn}`)}<figcaption>${t}, ${bredd} px, ${vynamn}</figcaption></figure>`).join('')}</div>`;
    return `<details class="kdel" ${oppen('ref-' + k.id)}><summary>Bredvid referensen, i mobil och dator</summary>
      <p class="under">Huvudreferensen: <b>${esc(r.namn || '')}</b>. Vänster dess startsida som den fångades, höger förslaget; ${vynamn} (byt med knapparna ovan).</p>
      <h4>Mobil 390</h4>${par('390')}<h4>Dator 1440</h4>${par('1440')}</details>`; };
  // skaparens korta redovisning ur RIKTNING.md; en rubrik som saknas eller är tom sägs, inget fylls i
  const redovisning = (k) => { const r = k.redovisning || []; if (!r.length) return '';
    const saknas = r.filter((x) => !x.finns).length;
    const del = (x) => `<h4>${esc(KREDOVISNING[x.rubrik] || x.rubrik)}</h4>${!x.finns ? `<p class="under rod-text">RIKTNING.md saknar rubriken "${esc(x.rubrik)}".</p>`
      : x.html ? `<div class="prosa">${x.html}</div>` : `<p class="under rod-text">Rubriken "${esc(x.rubrik)}" i RIKTNING.md är tom.</p>`}${x.rubrik === 'Idén' && k.hypotes ? `<p class="under"><b>Planens hypotes</b>, skriven före skissen: ${esc(k.hypotes)}</p>` : ''}`;
    return `<details class="kdel" ${oppen('red-' + k.id)}><summary>Redovisningen: idén, referenserna, det överförda och svagheterna${saknas ? ` (${saknas} av ${r.length} rubriker saknas)` : ''}</summary>${r.map(del).join('')}</details>`; };
  // de tekniska kontrollerna för sig: de mäter bygget, inte designen (ägarens uppdrag 2026-10-06, punkt 8)
  const tekniskt = (k) => { const brister = k.brister || [], fel = k.design_fel || [], pass = Object.entries(k.kompetenspass || {}), n = brister.length + fel.length;
    return `<details class="kdel ktek" ${oppen('tek-' + k.id)}><summary>Tekniska kontroller, inget godkännande av designen${n ? ` <span class="chip rod">${n} ${n > 1 ? 'brister' : 'brist'}</span>` : ''}</summary>
      <p class="under">Bygget, skärmbilderna och de snabba kontrollerna, skilda från din visuella bedömning. Ett grönt test eller ett internt betyg betyder inte att du har godkänt designen; det gör bara ditt beslut.</p>
      <ul>${brister.length ? `<li class="rod-text">Snabba kontroller: ${esc(brister.join('; '))}</li>` : '<li>Snabba kontroller: inga brister.</li>'}
        ${pass.length ? `<li>Kompetenspass: ${pass.map(([p_, g]) => `${esc(KPASS[p_] || p_)} ${g === true ? (p_ === 'skapa' ? 'kärnan läst hel' : 'genomfört') : g === false ? '<span class="rod-text">' + (p_ === 'skapa' ? 'kärnan inte läst hel' : 'ej genomfört') + '</span>' : 'ej verifierat'}`).join(' · ')} (ett läskvitto är belägg för läsning, inte för tillämpning)</li>` : ''}
        ${fel.length ? `<li class="rod-text">DESIGN.md: ${esc(fel.join('; '))}</li>` : ''}
        ${(k.upplysningar || []).length ? `<li>Upplysningar, inga brister: ${esc(k.upplysningar.join('; '))}</li>` : ''}
        ${k.axe ? `<li>axe: ${esc(String(k.axe.allvarliga ?? k.axe.fel ?? '–'))} allvarliga fynd${(k.axe.regler || []).length ? ' (' + esc(k.axe.regler.join('; ')) + ')' : ''}</li>` : ''}</ul></details>`; };
  const kort = (k) => `<section class="kort kkort${markerade.has(k.id) ? ' markerad' : ''}" data-k="${esc(k.id)}">
      <div class="rad mellan"><h3>${esc(k.etikett)}</h3><span class="chip ${KCHIP[k.status] || ''}">${esc(k.statustext)}</span></div>
      ${bilderna(k)}
      <div class="rad">${oppna(k)}${fullstorlek(k)}</div>
      <label class="markera"><input type="checkbox" data-markera="${esc(k.id)}"${markerade.has(k.id) ? ' checked' : ''}> Markera</label>
      ${refjamfor(k)}
      ${redovisning(k)}
      <details class="kdel"${delar[k.id] ? ' open' : ''}><summary>Det jag gillar här</summary><textarea data-del="${esc(k.id)}" placeholder="Till exempel: hur projekten visas, rubrikernas tyngd, mobilens första vy. Det följer med ordagrant till de förslag du väljer.">${esc(delar[k.id] || '')}</textarea></details>
      ${tekniskt(k)}
      ${forklaring(k)}</section>`;
  const lage = d.steg === 'klar_for_bedomning' ? `${visbara.length} av ${alla.length} förslag klara för din bedömning${d.fas === 'forfining' ? ' (efter förfiningen)' : ''}. Klar ${tid(d.klar)}.`
    : d.steg === 'fel' ? `Körningen föll: ${esc(d.fel || '')}. ${visbara.length} förslag går att bedöma.`
    : d.avbruten ? `Körningen avbröts i steg ${esc(d.steg || '')}; den tas upp igen med atelje.py --fortsatt utan att något klart görs om.`
    : `Pågår (steg ${esc(d.steg || '')}, startad ${tid(d.startad)}): ${visbara.length} av ${alla.length} klara.`;
  const forsiktig = visbara.length < (d.antal || alla.length) && klara && d.fas !== 'forfining' ? `<p class="meddelande fel">Färre förslag än planerat blev klara (${visbara.length} av ${d.antal || alla.length}); skälen står under "Förslag som inte blev klara".</p>` : '';
  const valbara = Object.keys(KBESLUT).filter((b) => (b === 'putsa' || b === 'godkand') ? forfinade : true);
  const tidigare = (d.domar || []).map((x) => `<p class="under">${tid(x.tid)} · ${esc(x.kalla)} · <b>${esc((KBESLUT[x.beslut] || BESLUT[x.beslut] || x.beslut).split(':')[0])}</b>${(x.kandidater || []).length ? ' · ' + esc(x.kandidater.map((k) => k.etikett || k.id).join(', ')) : ''}: ${esc(String(x.text || '').slice(0, 300))}</p>`).join('');
  $('#vy').innerHTML = `<h1>Prototyp · ${esc(slug)}</h1>
    <p class="under">${lage} ${d.godkand ? `<b>Godkänd för helbygge ${tid(d.godkand.tid)}</b>; bygget tar vid från den.` : d.kandidatlage === 'skiss' && d.fas !== 'forfining' ? 'Skisser: första vyn och den viktigaste sektionen, i mobil och dator. Förslagen har neutrala namn i slumpad ordning. En intern granskare ser skisserna när tiden räcker, och skaparen får svara; granskarens omdöme och skaparens svar visas efter ditt första beslut, och ingen modell har rangordnat förslagen. Körningens redovisning visas efter ditt första beslut, och de du väljer fördjupas till hela startsidan, undersidan och besökarens flöde.' : 'Förslagen har neutrala namn i slumpad ordning. Panelens granskning, planens titlar och körningens redovisning visas efter ditt första beslut.'}</p>
    ${forsiktig}
    <div class="kverktyg" role="group" aria-label="Bredd">
      ${bredder.map((b) => `<button class="knapp" data-bredd="${b}" aria-pressed="${b === kBredd}">${esc(KBREDDER[b])}</button>`).join('')}
      <span class="skiljare" aria-hidden="true"></span>
      <button class="knapp" data-hela="0" aria-pressed="${!kHela}">Första vyn</button>
      <button class="knapp" data-hela="1" aria-pressed="${kHela}">Hela sidan</button>
    </div>
    <p class="under" style="margin:-8px 0 16px">Bilderna först; klicka på en bild för att öppna den i full storlek. Under bilderna, hopfällt: referensen bredvid förslaget, skaparens korta redovisning och de tekniska kontrollerna. Markera förslag för att se dem sida vid sida och för ditt beslut längst ned.</p>
    <div class="kgrid" style="--kmin:${{ par: '100%', 1440: '420px', 1280: '420px', 768: '300px' }[kBredd] || '240px'}">${visbara.map(kort).join('') || '<p class="tom">Inga förslag klara än.</p>'}</div>
    <section id="k-jamfor" style="margin-top:28px"></section>
    <section id="k-observation" class="obs"></section>
    ${ovriga.length ? `<details style="margin-top:24px"><summary>Förslag som inte blev klara (${ovriga.length})</summary>${ovriga.map((k) => `<p class="under"><b>${esc(k.etikett)}</b> · ${esc(k.statustext)}: ${esc(k.skal || '')}</p>`).join('')}</details>` : ''}
    ${klara && visbara.length ? `<section class="kort" style="margin-top:24px"><h2>Ditt beslut</h2>
      <p class="under">Välj en riktning: markera förslaget och välj vidareutveckling. Kombinera kvaliteter: markera de förslag som ska bära vidare och skriv under "Det jag gillar här" i andra förslag vad du vill ta därifrån; det följer med ordagrant. Underkänn allt: förkasta alla. Beslutet sparas i domloggen med förslagens versioner och läses av nästa körning.</p>
      <div>${valbara.map((b) => `<div><label><input type="radio" name="k-b" value="${b}"> ${esc(KBESLUT[b])}</label></div>`).join('')}</div>
      <textarea id="k-text" rows="5" style="width:100%;margin-top:8px" placeholder="Vad bär, vad håller inte, vad ska nästa steg pröva? Dina ord följer med ordagrant."></textarea>
      <div class="rad" style="margin-top:8px"><button class="knapp primar" id="k-spara">Spara beslutet</button> <span class="under" id="k-antal"></span></div>
      ${tidigare ? `<details style="margin-top:12px"><summary>Domloggen (${d.domar.length})</summary>${tidigare}</details>` : ''}</section>` : ''}
    ${d.domd && d.jamforelse ? `<details style="margin-top:24px"><summary>Falsk variation enligt jämförelsen</summary><p>${esc(d.jamforelse.sammanfattning || '')}</p>${(d.jamforelse.par || []).map((p) => `<p class="under">${esc(p.a)} och ${esc(p.b)}: ${esc(p.grad)} — ${esc(p.skal)}</p>`).join('')}</details>` : ''}
    ${d.domd && d.forskning_md ? `<details><summary>Researchen (FORSKNING.md)</summary><div class="prosa">${d.forskning_md}</div></details>` : ''}
    ${d.domd && d.redovisning_md ? `<details><summary>Redovisningen (REDOVISNING.md)</summary><div class="prosa">${d.redovisning_md}</div></details>` : ''}`;
  const visaJamforelse = () => {
    const valda = visbara.filter((k) => markerade.has(k.id));
    // en rad per bredd, hela sidan: mobil och dator var för sig i läget Mobil och dator
    const rad = (bredd, knappar) => `<div class="kjamfor v${bredd}">${valda.map((k) => `<div><h3>${esc(k.etikett)}</h3>${ram(k, bredd, true)}${knappar ? `<div class="rad" style="margin-top:8px">${oppna(k)}</div>` : ''}</div>`).join('')}</div>`;
    $('#k-jamfor').innerHTML = valda.length >= 2 ? `<h2>Sida vid sida (${valda.length}), hela sidan</h2>${kBredd === 'par' ? `<h3>Mobil 390</h3>${rad('390', true)}<h3>Dator 1440</h3>${rad('1440', false)}` : rad(kBredd, true)}` : '';
    const n = $('#k-antal'); if (n) n.textContent = markerade.size ? `${markerade.size} markerade` : '';
  };
  document.querySelectorAll('[data-markera]').forEach((c) => c.onchange = () => {
    c.checked ? markerade.add(c.dataset.markera) : markerade.delete(c.dataset.markera);
    c.closest('.kkort').classList.toggle('markerad', c.checked); visaJamforelse();
  });
  document.querySelectorAll('[data-del]').forEach((f) => f.oninput = () => { delar[f.dataset.del] = f.value; });
  document.querySelectorAll('[data-foreval]').forEach((c) => c.onchange = () => { c.checked ? foreval.add(c.dataset.foreval) : foreval.delete(c.dataset.foreval); });
  document.querySelectorAll('[data-forb]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { await post('/api/prototyp/' + encodeURIComponent(slug) + '/forbattring', { kid: b.dataset.forb, val: b.dataset.val }); b.textContent += ' ✓'; } catch (e) { alert(e.message); b.disabled = false; }
  });
  document.querySelectorAll('[data-oppen]').forEach((x) => x.ontoggle = () => { x.open ? ks.oppna.add(x.dataset.oppen) : ks.oppna.delete(x.dataset.oppen); });
  document.querySelectorAll('[data-bredd]').forEach((b) => b.onclick = () => { kBredd = b.dataset.bredd; try { localStorage.setItem('kandidat-visning', kBredd); } catch (e) {} kandidatvy(slug, d); });
  document.querySelectorAll('[data-hela]').forEach((b) => b.onclick = () => { kHela = b.dataset.hela === '1'; kandidatvy(slug, d); });
  visaJamforelse();
  observationsvy(slug, alla);
  const knapp = $('#k-spara');
  if (knapp) knapp.onclick = async () => {
    const b = (document.querySelector('input[name="k-b"]:checked') || {}).value;
    const text = $('#k-text').value;
    if (!b) { alert('Välj ett beslut.'); return; }
    const kand = visbara.filter((k) => markerade.has(k.id)).map((k) => ({ id: k.id, version: foreval.has(k.id) && k.forbattring ? k.forbattring.fore : k.version }));
    if (['valj', 'putsa', 'godkand'].includes(b) && !kand.length) { alert('Markera förslaget eller förslagen beslutet gäller.'); return; }
    if (b === 'jamfor' && kand.length < 2) { alert('Markera minst två förslag att jämföra.'); return; }
    if (b === 'godkand' && kand.length !== 1) { alert('Markera exakt ett förfinat förslag att godkänna.'); return; }
    if (['forkasta', 'ny_riktning', 'putsa'].includes(b) && !text.trim()) { alert('Skriv vad som inte håller och vad nästa steg ska pröva.'); return; }
    knapp.disabled = true;
    try { await post('/api/prototyp/' + encodeURIComponent(slug), { beslut: b, kandidater: kand, delar, text, startad }); prototypvy(slug); } catch (e) { alert(e.message); knapp.disabled = false; }
  };
}

// Observationen (ägarens uppdrag 2026-10-06): det som syns i sessionernas transkript och loggar under arbetet, räknat
// utan modell och utan att påverka arbetet (kontroller/observation.py). Skaparens egen redovisning står i korten.
const ROLLER = [['skisskritik', 'kritikern, blind'], ['planprovning', 'planprövningen'], ['jamforelse', 'jämförelsen'], ['forbattra', 'förbättringen'],

      <td class="tal">${tal(p.poang?.hastighet)}</td><td class="tal">${tal(p.poang?.seo)}</td><td class="tal">${tal(p.poang?.mobil)}</td><td class="tal">${tal(p.poang?.design)}</td><td class="tal"><b>${tal(p.poang?.total)}</b></td><td>${pchip(p.status)}</td></tr>`;

        <button class="knapp" id="analysera" ${d.jobb.pagar ? 'disabled' : ''}>Analysera 10 till</button><span id="k-svar" class="under"></span></div></div>
    <div class="chips" style="margin:14px 0">${filterchips.map(([v, t]) => `<button class="chip ${pfilter === v ? 'acc' : ''}" data-f="${esc(v)}">${esc(t)}</button>`).join('')}</div>

document.addEventListener('click', async (e) => {
  const las = e.target.closest('[data-flode-las]');
  if (las) {
    const generation = flodeGeneration + 1, hash = location.hash;
    las.disabled = true;
    $('#flode-handlingssvar').textContent = 'Läser aktuellt läge…';
    try { if (await flodesvy(las.dataset.flodeLas)) $('#flode-besked-rubrik')?.focus(); }
    catch (err) { if (generation===flodeGeneration && hash===location.hash && $('#flode-handlingssvar')) $('#flode-handlingssvar').textContent = 'Läget gick inte att läsa: ' + err.message + '. Inget arbete startades.'; }
    finally { las.disabled = false; }
    return;
  }
  const knapp = e.target.closest('[data-flodeshandling]');
  if (!knapp || knapp.disabled) return;
  const slug = knapp.dataset.flodeSlug, handling = knapp.dataset.flodeshandling;
  const hash=location.hash; let generation=flodeGeneration;
  const aktuell=()=>generation===flodeGeneration && hash===location.hash;
  const key = 'nwp-start:' + slug + ':' + handling;
  let startId;
  try { startId = sessionStorage.getItem(key) || crypto.randomUUID(); sessionStorage.setItem(key, startId); }
  catch { $('#flode-handlingssvar').textContent = 'Webbläsaren kunde inte spara start-id. Ingen start skickades; tillåt sessionslagring och försök igen.'; return; }
  knapp.disabled = true; knapp.setAttribute('aria-busy', 'true');
  $('#flode-handlingssvar').textContent = 'Skickar begäran… Du kan läsa aktuellt läge om svaret dröjer.';
  try {
    const r = await post('/api/flode/' + encodeURIComponent(slug) + '/start', { handling, start_id: startId });
    if (!aktuell()) return;
    generation=flodeGeneration+1;
    if (!await flodesvy(slug)) return;
    // start-id släpps först när svaret är bekräftat och läget omläst (GR-20261008-r117-claude#B7); annars används samma id igen
    if (sessionStorage.getItem(key)===startId) sessionStorage.removeItem(key);
    $('#flode-handlingssvar').textContent = r.besked;
    $('#flode-besked-rubrik')?.focus();
  } catch (err) {
    const svar = $('#flode-handlingssvar');
    if (svar && aktuell()) svar.textContent = 'Svaret gick inte att bekräfta: ' + err.message + '. Läs aktuellt läge eller försök igen; samma start-id används.';
    knapp.disabled = false;
  } finally { knapp.removeAttribute('aria-busy'); }
});
