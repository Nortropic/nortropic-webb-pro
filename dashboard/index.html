<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nortropic webb-pro</title>
<style>
:root {
  --bg: #f5f4f0; --yta: #ffffff; --yta2: #faf9f6; --text: #1c1b19; --dampad: #6a675f; --linje: #e3e0d8;
  --accent: #1d5b47; --accent-mjuk: #e3efe9; --gron: #1e7a4b; --gron-mjuk: #e4f3ea; --rod: #b1281f; --rod-mjuk: #fbe9e7;
  --gul: #8a6200; --gul-mjuk: #fbf1d9; --skugga: 0 1px 2px rgba(20,18,12,.05), 0 4px 16px rgba(20,18,12,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131311; --yta: #1b1b19; --yta2: #20201d; --text: #ebe9e4; --dampad: #a3a097; --linje: #2f2e2a;
    --accent: #7fc4a6; --accent-mjuk: #1e2f28; --gron: #6fcf97; --gron-mjuk: #17291f; --rod: #f08a80; --rod-mjuk: #33201d;
    --gul: #e6b84d; --gul-mjuk: #302714; --skugga: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.topp { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linje); }
.topp-inre { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.mark { font-weight: 650; letter-spacing: -.01em; }
.mark span { color: var(--dampad); font-weight: 500; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--dampad); padding: 6px 10px; border-radius: 8px; font-size: 14px; }
nav a:hover { color: var(--text); background: var(--yta); }
nav a.aktiv { color: var(--text); background: var(--yta); box-shadow: inset 0 0 0 1px var(--linje); }
nav b { font-weight: 600; font-size: 12px; background: var(--accent-mjuk); color: var(--accent); border-radius: 99px; padding: 1px 7px; margin-left: 4px; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; line-height: 1.2; }
h2 { font-size: 17px; margin: 28px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 18px 0 6px; }
.under { color: var(--dampad); margin: 0 0 20px; }
.kort { background: var(--yta); border: 1px solid var(--linje); border-radius: 12px; padding: 16px 18px; box-shadow: var(--skugga); }
.rutnat { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.siffror { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 8px; }
.siffra { padding: 14px 16px; }
.siffra .tal { font-size: 28px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.siffra .etikett { color: var(--dampad); font-size: 13px; }
.bygge-kort { display: block; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.bygge-kort:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--linje)); }
.bygge-kort .namn { font-weight: 620; font-size: 16px; }
.bygge-kort .ort { color: var(--dampad); font-size: 13px; }
.steg { display: flex; gap: 4px; margin: 12px 0 10px; }
.steg i { flex: 1; height: 6px; border-radius: 3px; background: var(--linje); }
.steg i.klar { background: var(--accent); }
.steglista { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 18px 0 6px; }
.steglista div { font-size: 12px; color: var(--dampad); border-top: 3px solid var(--linje); padding-top: 6px; }
.steglista div.klar { color: var(--text); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--yta2); border: 1px solid var(--linje); color: var(--dampad); white-space: nowrap; }
.chip.ok { background: var(--gron-mjuk); color: var(--gron); border-color: transparent; }
.chip.rod { background: var(--rod-mjuk); color: var(--rod); border-color: transparent; }
.chip.gul { background: var(--gul-mjuk); color: var(--gul); border-color: transparent; }
.chip.acc { background: var(--accent-mjuk); color: var(--accent); border-color: transparent; }
.puls::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; animation: puls 1.4s ease-in-out infinite; }
@keyframes puls { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .puls::before { animation: none; } }
.rad { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mellan { justify-content: space-between; }
.knapp { appearance: none; border: 1px solid var(--linje); background: var(--yta); color: var(--text); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 9px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.knapp:hover { border-color: var(--dampad); }
.knapp.primar { background: var(--accent); border-color: var(--accent); color: var(--yta); font-weight: 560; }
.knapp:disabled { opacity: .5; cursor: default; }
#qr { border: 1px solid var(--linje); border-radius: 12px; background: var(--yta); color: var(--text); padding: 16px; max-width: 360px; }
#qr svg { display: block; width: 100%; height: auto; margin-top: 12px; }
#qr::backdrop { background: rgb(0 0 0 / .4); }
details.mer { display: inline; }
details.mer summary { display: inline; cursor: pointer; color: var(--accent); }
details.mer[open] { display: block; margin-top: 4px; }
.flikar { display: flex; gap: 2px; border-bottom: 1px solid var(--linje); margin: 22px 0 18px; overflow-x: auto; }
.flikar button { appearance: none; border: 0; background: none; font: inherit; font-size: 14px; color: var(--dampad); padding: 9px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.flikar button.aktiv { color: var(--text); border-color: var(--text); }
.bilder { display: grid; gap: 14px; grid-template-columns: 220px 1fr; align-items: start; }
.bilder figure { margin: 0; }
.bilder img, .galleri img { width: 100%; border: 1px solid var(--linje); border-radius: 10px; display: block; background: var(--yta2); }
figcaption { font-size: 12px; color: var(--dampad); margin-top: 6px; }
.galleri { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
@media (max-width: 700px) { .bilder { grid-template-columns: 1fr; } .steglista { grid-template-columns: repeat(4, 1fr); } }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linje); vertical-align: top; }
th { color: var(--dampad); font-weight: 560; font-size: 13px; }
td.tal, th.tal { text-align: right; font-variant-numeric: tabular-nums; }
.tabell { overflow-x: auto; }
.prosa { max-width: 78ch; }
.prosa p, .prosa li { margin: 6px 0; }
.prosa code, code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--yta2); border: 1px solid var(--linje); border-radius: 5px; padding: 1px 5px; }
pre { background: var(--yta2); border: 1px solid var(--linje); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
pre code { border: 0; padding: 0; background: none; }
blockquote { margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--linje); color: var(--dampad); }
.tom { color: var(--dampad); padding: 22px; text-align: center; border: 1px dashed var(--linje); border-radius: 12px; }
.handling { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dampad); padding: 4px 0; border-bottom: 1px solid var(--linje); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.handling b { color: var(--text); font-weight: 600; }
.fraga { padding: 16px 0; border-bottom: 1px solid var(--linje); }
.fraga > label, .fraga > .q { display: block; font-weight: 560; margin-bottom: 10px; }
.fraga .varfor { font-weight: 400; color: var(--dampad); font-size: 13px; display: block; margin-top: 2px; }
.val { display: flex; flex-wrap: wrap; gap: 6px; }
.val label { cursor: pointer; }
.val input { position: absolute; opacity: 0; pointer-events: none; }
.val span { display: inline-block; padding: 7px 12px; border: 1px solid var(--linje); border-radius: 99px; font-size: 14px; background: var(--yta); }
.val input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--yta); }
.val input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.skala { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.skala small { color: var(--dampad); }
input[type=file] { font: inherit; font-size: 14px; color: var(--dampad); }
textarea, input[type=url], input[type=text] { width: 100%; font: inherit; color: inherit; background: var(--yta); border: 1px solid var(--linje); border-radius: 9px; padding: 9px 11px; }
textarea { min-height: 76px; resize: vertical; }
textarea:focus, input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.matris td, .matris th { text-align: center; padding: 6px 4px; }
.val.cell { justify-content: center; flex-wrap: nowrap; }
@media (max-width: 520px) { .val.cell span { padding: 6px 9px; font-size: 13px; } .matris td:first-child { font-size: 13px; } }
.matris td:first-child, .matris th:first-child { text-align: left; }
.fraga img { max-width: 520px; width: 100%; border: 1px solid var(--linje); border-radius: 10px; margin-bottom: 10px; }
.alt-bilder { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 820px; margin-bottom: 10px; }
.alt-bilder figure { margin: 0; }
.alt-bilder img { max-width: 100%; margin-bottom: 4px; display: block; }
.kverktyg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 18px; }
.kverktyg .knapp[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--yta); }
.kgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--kmin, 260px)), 1fr)); }
.kkort { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.kkort.markerad { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-mjuk); }
.kkort h3 { margin: 0; font-size: 16px; }
.kram { display: block; border: 1px solid var(--linje); border-radius: 10px; overflow: hidden; background: var(--yta2); }
.kram img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border: 0; border-radius: 0; }
.kram.v390 { aspect-ratio: 390 / 844; } .kram.v768 { aspect-ratio: 768 / 1024; } .kram.v1440 { aspect-ratio: 1440 / 900; }
.kram.v1280 { aspect-ratio: auto; } .kram.v1280 img { height: auto; }  /* mellanbreddens höjd följer bilden */
.kram.hela { aspect-ratio: auto; height: 560px; overflow-y: auto; }
.kram.hela img { height: auto; object-fit: initial; }
/* mobil och dator bredvid varandra i samma höjd och nästan samma skala: 390/844 mot 1440/900 ger kolumnerna 1 : 3,46 */
.kpar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3.46fr); gap: 12px; align-items: start; }
.kfig { margin: 0; }
.kfig figcaption { margin-top: 4px; }
.kjamfor { display: grid; gap: 16px; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); overflow-x: auto; padding-bottom: 6px; }
.kjamfor.v390 { grid-auto-columns: minmax(240px, 300px); }  /* mobilen i mobilstorlek, också när få är markerade */
.kjamfor.v1280, .kjamfor.v1440 { grid-auto-columns: minmax(480px, 1fr); }
.kjamfor .kram.hela { height: 75vh; }
.kdel { border-top: 1px solid var(--linje); padding-top: 8px; }
.kdel > summary { cursor: pointer; font-weight: 560; }
/* observationen: det som syns i sessionernas transkript och loggar under arbetet (kontroller/observation.py) */
.obs { margin-top: 28px; }
.obs-grid { display: grid; gap: 12px 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); margin: 8px 0; }
.obs-grid h4 { margin: 0 0 4px; font-size: 13px; color: var(--dampad); font-weight: 600; }
.obs ul { margin: 4px 0; padding-left: 18px; }
.obs-bilder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3.46fr); gap: 8px; align-items: start; }
.obs-bilder img { width: 100%; display: block; border: 1px solid var(--linje); border-radius: 8px; }
.obs-not { font-size: 12px; color: var(--dampad); }
.obs-varn { font-size: 12px; color: var(--gul); }
.kdel .under { margin: 6px 0; }
.kdel > h4 { margin: 16px 0 4px; font-size: 14.5px; }
.kdel .prosa :is(h3, h4, h5) { margin: 10px 0 2px; font-size: 13px; font-weight: 600; color: var(--dampad); }  /* skaparens underrubriker under vyns */
.kjref { display: grid; gap: 12px; align-items: start; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kjref.v390 { grid-template-columns: repeat(2, minmax(0, 260px)); }
.kdel ul { margin: 6px 0; padding-left: 20px; }
.ktek > summary { font-weight: 500; color: var(--dampad); }
@media (max-width: 700px) { .kpar { grid-template-columns: 1fr; } .kpar .kfig:first-child { max-width: 240px; } }
.kkort textarea { min-height: 64px; font-size: 14px; }
.kkort .rad { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kkort label.markera { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; font-weight: 560; cursor: pointer; }
.kkort label.markera input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.kverktyg .skiljare { width: 1px; align-self: stretch; background: var(--linje); margin: 0 4px; }
.alt-bilder figcaption { font-size: 13px; color: var(--dampad); }
.kommando { display: flex; gap: 8px; align-items: stretch; margin: 6px 0 14px; }
.kommando code { flex: 1; display: block; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
details.post { border: 1px solid var(--linje); border-radius: 12px; background: var(--yta); margin-bottom: 10px; }
details.post summary { cursor: pointer; padding: 13px 16px; list-style: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details.post summary::-webkit-details-marker { display: none; }
details.post summary .titel { flex: 1 1 300px; font-weight: 560; }
details.post .innehall { padding: 0 16px 14px; }
.ok-text { color: var(--gron); } .rod-text { color: var(--rod); }
.meddelande { padding: 12px 14px; border-radius: 10px; background: var(--gron-mjuk); color: var(--gron); margin: 12px 0; }
.meddelande.fel { background: var(--rod-mjuk); color: var(--rod); }
select, input[type=number], input[type=email] { font: inherit; color: inherit; background: var(--yta); border: 1px solid var(--linje); border-radius: 9px; padding: 8px 10px; }
button.chip { font: inherit; font-size: 12px; cursor: pointer; }
label.rad { gap: 6px; }
.varfor-rad { padding: 6px 0; border-bottom: 1px solid var(--linje); display: flex; gap: 10px; align-items: baseline; }
.varfor-rad .p { font-variant-numeric: tabular-nums; color: var(--rod); min-width: 36px; text-align: right; }
.varfor-rad .k { color: var(--dampad); font-size: 12px; min-width: 70px; }
</style>
</head>
<body>
<header class="topp"><div class="topp-inre">
  <div class="mark">Nortropic <span>webb-pro</span></div>
  <nav>
    <a href="#/" data-v="">Översikt</a>
    <a href="#/backlog" data-v="backlog">Backlog <b id="n-backlog" hidden></b></a>
    <a href="#/kirurgen" data-v="kirurgen">Kirurgen <b id="n-kirurg" hidden></b></a>
    <a href="#/prospekt" data-v="prospekt">Prospekt <b id="n-prospekt" hidden></b></a>
    <a href="#/lardomar" data-v="lardomar">Lärdomar</a>
    <a href="#/ab" data-v="ab">Jämförelser</a>
    <a href="#/kalibrering" data-v="kalibrering">Kalibrering</a>
    <a href="#/prototyp" data-v="prototyp">Prototyp</a>
    <a href="#/designprov" data-v="designprov">Designprov</a>
    <a href="#/starta" data-v="starta">Starta</a>
  </nav>
</div></header>
<main id="vy"><p class="under">Laddar …</p></main>
<dialog id="qr" aria-label="Sajten i telefonen"><form method="dialog" class="rad mellan"><b>Sajten i telefonen</b><button class="knapp">Stäng</button></form><div class="innehall"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (p) => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).fel || r.status); return r.json(); };
const post = async (p, body) => { const r = await fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.fel || r.status); return j; };
const tid = (t) => t ? new Date(t).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' }) : '–';
const GRINDNAMN = { bygge: 'Bygge', seo: 'SEO', standard: 'Byggstandard', axe: 'Tillgänglighet (axe)', lighthouse: 'Lighthouse', spill: 'Spill', 'utan-js': 'Utan JS' };
const kopiera = (text, knapp) => { navigator.clipboard?.writeText(text); const t = knapp.textContent; knapp.textContent = 'Kopierat'; setTimeout(() => (knapp.textContent = t), 1400); };
const kommando = (text) => `<div class="kommando"><code>${esc(text)}</code><button class="knapp" onclick="kopiera(${esc(JSON.stringify(text))}, this)">Kopiera</button></div>`;
let timer = null, flik = 'oversikt';

function aktivNav(v) { document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('aktiv', a.dataset.v === v)); }
function raknare(o) {
  const b = $('#n-backlog'); b.hidden = !o.backlog_vilande; b.textContent = o.backlog_vilande;
  const k = $('#n-kirurg'); k.hidden = !o.intag_pagar; k.textContent = o.intag_pagar ? o.intag_pagar + ' pågår' : '';
  const pr = $('#n-prospekt'); if (pr) { pr.hidden = !o.prospekt_vantar; pr.textContent = o.prospekt_vantar || ''; }
}
function grindchips(prov) {
  if (!prov) return '<span class="chip">Inte provad</span>';
  return Object.entries(prov.grindar).map(([n, ok]) => `<span class="chip ${ok ? 'ok' : 'rod'}">${esc(GRINDNAMN[n] || n)}</span>`).join('');
}
function statuschip(b) {
  if (b.pagar) return '<span class="chip acc puls">Körning pågår</span>';
  // avslutat är inte godkänt: stoppvakten släppte vid sitt tak (rött prov, saknad rapport eller underkänd granskning)
  const utan = b.slappt_utan_godkannande ? '<span class="chip rod">Avslutat utan godkännande</span>' : '';
  if (b.domd) return utan + '<span class="chip">Dömd</span>';
  if (b.prov && b.steg[6].klar) return utan + '<span class="chip gul">Väntar på din dom</span>';
  if (b.prov) return `<span class="chip ${b.prov.ok ? 'ok' : 'rod'}">${b.prov.ok ? 'Grönt' : 'Rött'}</span>`;
  return '<span class="chip">Påbörjad</span>';
}

async function oversikt() {
  aktivNav('');
  const o = await api('/api/oversikt'); raknare(o);
  const b = o.byggen;
  const vantar = b.filter((x) => !x.domd && x.steg[6].klar && !x.pagar);
  $('#vy').innerHTML = `
    <h1>Översikt</h1><p class="under">Byggen åt riktiga verksamheter. Du dömer, backloggen fångar resten.</p>
    <div class="siffror">
      <div class="kort siffra"><div class="tal">${b.length}</div><div class="etikett">byggen</div></div>
      <div class="kort siffra"><div class="tal">${b.filter((x) => x.pagar).length}</div><div class="etikett">körningar pågår</div></div>
      <div class="kort siffra"><div class="tal">${vantar.length}</div><div class="etikett">väntar på din dom</div></div>
      <div class="kort siffra"><div class="tal">${o.backlog_vilande}</div><div class="etikett">vilande i backloggen</div></div>
    </div>
    ${vantar.length ? `<h2>Väntar på din dom</h2><div class="rutnat">${vantar.map(kort).join('')}</div>` : ''}
    <h2>Alla byggen</h2>
    ${b.length ? `<div class="rutnat">${b.map(kort).join('')}</div>` : `<div class="tom">Inga byggen än. Starta ett under <a href="#/starta">Starta</a>.</div>`}
    <div id="verktygslada"></div>`;
  verktygsladavy();
  timer = setTimeout(oversikt, b.some((x) => x.pagar) ? 6000 : 20000);
}
// Verktygslådan: det dagliga underhållet prövar och tar in uppdateringar mellan byggena (kontroller/underhall.py)
async function verktygsladavy() {
  const el = $('#verktygslada'); if (!el) return;
  const d = await api('/api/underhall').catch(() => null); if (!d) return;
  const s = d.senast, a = (s && s.antal) || {};
  const bytta = d.andringar.filter((x) => x.matinstrument);

function bDom(b, f) {

    </form>`;
  $('#domform').onsubmit = async (e) => {
    e.preventDefault();
    const svar = {};
    for (const [k, v] of new FormData(e.target).entries()) {
      if (!String(v).trim()) continue;
      if (k.includes('::')) { const [id, rad] = k.split('::'); (svar[id] ||= {})[rad] = v; }

  };
}

  // Registret ritas bara vid full laddning och när ett intag just blivit klart, så att en påbörjad motivering inte raderas.

// Sammanfattningen kapas vid ett meningsslut, aldrig mitt i ett ord; resten under Visa mer. Spanaren sparar högst
// 600 tecken: slutar texten där utan skiljetecken markeras det med … (ägaren 2026-10-03: "texten blir avkapad").
function sammanfattning(s) {
  let t = String(s || '').trim();
  if (t.length >= 590 && !/[.!?…)"”']$/.test(t)) t = t.replace(/\s+\S*$/, '') + ' …';
  if (t.length <= 340) return esc(t);
  const m = t.slice(0, 340).match(/^[\s\S]*[.!?](?=\s)/);
  const forsta = m ? m[0] : t.slice(0, 340).replace(/\s+\S*$/, '');
  const rest = t.slice(forsta.length).trim();
  return `${esc(forsta)}${m ? '' : ' …'} <details class="mer"><summary>Visa mer</summary>${esc(rest)}</details>`;
}

const NIVA = { over: 'Tydligt över ribban', nastan: 'Nästan', generisk: 'Generisk' };
async function kalibreringvy() {
  aktivNav('kalibrering');
  const lista = await api('/api/kalibrering');
  const kort = (e) => {
    const b = e.bilder || {};
    const rad = (namn, rubrik) => (b[namn + '-390-forsta'] || b[namn + '-1440-forsta']) ? `<div><b>${rubrik}</b><div class="galleri" style="grid-template-columns:1fr 2fr">${bild(b[namn + '-390-forsta'], 'mobil 390')}${bild(b[namn + '-1440-forsta'], 'dator 1440')}</div>${b[namn + '-390-hela'] ? `<details><summary>Hela sidan (390, nedskalad: rytmen)</summary>${bild(b[namn + '-390-hela'], 'hela sidan 390')}</details>` : ''}</div>` : '';
    const form = e.dom ? `<p class="under">Din dom: <b>${esc(NIVA[e.dom.niva] || e.dom.niva)}</b>${e.dom.skiljer ? ' · ' + esc(e.dom.skiljer) : ''}</p><p class="under">Adress: <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a> · roll: ${esc(e.roll || '')} · agentens hypotes: ${esc(NIVA[e.hypotes] || e.hypotes)}</p>`
      : `<div class="rad" style="margin-top:10px;flex-wrap:wrap;gap:12px">${Object.keys(NIVA).map((n) => `<label><input type="radio" name="niva-${e.id}" value="${n}"> ${NIVA[n]}</label>`).join('')}</div>
         <textarea id="sk-${e.id}" rows="3" style="width:100%;margin-top:8px" placeholder="Vad skiljer nivån? Bildval, beskärning, typografiska proportioner, komposition, rytm, detaljarbete."></textarea>
         <div class="rad" style="margin-top:8px"><button class="knapp primar" data-kal="${e.id}">Spara domen</button></div>`;
    return `<section class="kort" style="margin-bottom:24px"><h2>${esc(e.id)}</h2>${rad('start', 'Startsidan')}${rad('undersida', 'En undersida')}${form}</section>`;
  };
  $('#vy').innerHTML = `<h1>Kalibrering</h1><p class="under">Externa sajter utan namn. Döm var och en på mobil och dator: tydligt över ribban, nästan, eller generisk, och skriv exakt vad som skiljer. Adressen och agentens hypotes visas efter din dom. Domarna sparas privat (underlag/kalibrering/DOMAR.json) när du trycker Spara domen; tills dess ligger nivån och texten kvar som utkast i den här webbläsaren, också efter omladdning. Hälften blir ankare för granskarna, hälften hålls undan för att pröva dem.</p>${lista.map(kort).join('') || '<p>Inga exempel fångade än.</p>'}`;
  // utkast per exempel i localStorage (ägaren 2026-10-04: texten försvann vid omladdning innan domen var sparad)
  const utkastNyckel = (id) => 'kalibrering-utkast-' + id;
  for (const e of lista.filter((x) => !x.dom)) {
    let u = null; try { u = JSON.parse(localStorage.getItem(utkastNyckel(e.id)) || 'null'); } catch {}
    const ta = $('#sk-' + e.id); if (!ta) continue;
    if (u && typeof u.skiljer === 'string') ta.value = u.skiljer;
    if (u && u.niva) { const r = document.querySelector(`input[name="niva-${e.id}"][value="${u.niva}"]`); if (r) r.checked = true; }
    const spara = () => { try { localStorage.setItem(utkastNyckel(e.id), JSON.stringify({ niva: (document.querySelector(`input[name="niva-${e.id}"]:checked`) || {}).value || '', skiljer: ta.value })); } catch {} };
    ta.addEventListener('input', spara);
    document.querySelectorAll(`input[name="niva-${e.id}"]`).forEach((r) => r.addEventListener('change', spara));
  }
  document.querySelectorAll('[data-kal]').forEach((k) => k.onclick = async () => {
    const id = k.dataset.kal; const niva = (document.querySelector(`input[name="niva-${id}"]:checked`) || {}).value;
    if (!niva) { alert('Välj nivå först.'); return; }
    k.disabled = true;
    try { await post('/api/kalibrering/' + encodeURIComponent(id), { niva, skiljer: $('#sk-' + id).value }); try { localStorage.removeItem(utkastNyckel(id)); } catch {} kalibreringvy(); } catch (e) { alert(e.message); k.disabled = false; }
  });
}

  if (['ny', 'analyserad', 'utan-sajt'].includes(p.status)) knappar = knapp('Välj', 'valj', true) + knapp('Avvisa', 'avvisa');
  if (p.status === 'vald') knappar = knapp('Bygg demo', 'demo', true, d.bygge_pagar_annat, d.bygge_pagar_annat ? 'ett bygge pågår redan; en demo i taget' : '') + knapp('Skriv brev', 'brev', false, d.brev_lage.pagar || !pr.analys_tid, pr.analys_tid ? '' : 'ingen mätning att skriva ur') + knapp('Avvisa', 'avvisa');
  if (p.status === 'demo') knappar = knapp('Skriv brev', 'brev', true, d.brev_lage.pagar || !pr.analys_tid) + knapp('Avvisa', 'avvisa');
  if (p.status === 'utkast') knappar = knapp('Skriv om', 'brev', false, d.brev_lage.pagar) + knapp('Avvisa', 'avvisa');
  if (['skickat', 'svar'].includes(p.status)) knappar = (p.status === 'skickat' ? knapp('Markera svar', 'svar', true) : '') + knapp('Blev kund', 'kund', p.status === 'svar') + knapp('Nej tack', 'nej') + knapp('Stryk (avregistrera)', 'stryk');
  if (['kund', 'nej', 'avvisad'].includes(p.status)) knappar = (p.status !== 'nej' ? knapp('Stryk (avregistrera)', 'stryk') : '');
  const sajtrad = p.sajt?.url ? `<a href="${esc(p.sajt.url)}" target="_blank" rel="noopener">${esc(kortUrl(p.sajt.url))}</a> <span class="chip">${esc(p.sajt.kalla)}${p.sajt.sakerhet != null ? ' ' + tal(p.sajt.sakerhet) : ''}</span>`
    : `<span class="chip">ingen sajt</span>${p.sajt_kandidat ? ` kandidat: <a href="${esc(p.sajt_kandidat.url)}" target="_blank" rel="noopener">${esc(kortUrl(p.sajt_kandidat.url))}</a> (${tal(p.sajt_kandidat.sakerhet)}) ${knapp('Bekräfta sajten', 'sajt')}` : ''}
       <span class="rad" style="display:inline-flex;margin-left:8px"><input id="s-url" type="url" placeholder="eller ange adressen" style="width:260px">${knapp('Sätt', 'sajt-manuell')}</span>`;
  const rader = [['Hastighet', 'hastighet'], ['SEO', 'seo'], ['Mobil', 'mobil'], ['Design', 'design']];
  const lh = d.siffror || {};
  const underlag = Object.entries(pr.underlag || {}).filter(([kk, v]) => v != null && v !== false && v !== '' && !(Array.isArray(v) && !v.length) && !(typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length) && !['sidor'].includes(kk));
  const brev = d.brev, u = brev?.utkast || {}, red = brev?.redigerat || {}, g = brev?.godkand, mott = brev?.mottagare || {};
  const epost0 = mott.epost || p.epost || '';
  const visaKryss = epost0 && !ROLL.test(epost0.split('@')[0]);
  const brevHtml = p.fysisk_person
    ? `<div class="meddelande fel">Enskild firma är en fysisk person: inget mejl utan samtycke (marknadsföringslagen 19 §). Ring${p.tel ? ' ' + esc(p.tel) : ''} eller skriv brev. ${u.ringmanus ? '' : 'Skriv brev ger ett ringmanus ur mätningen.'}</div>
       ${u.ringmanus ? `<h3>Ringmanus</h3><div class="kort prosa">${esc(u.ringmanus)}</div>` : ''}`
    : brev ? `
      <label style="display:block">Ämne <input id="b-amne" type="text" value="${esc(red.amne || u.amne || '')}"></label>
      <label style="display:block;margin-top:10px">Text <textarea id="b-text" style="min-height:170px">${esc(red.text || u.text || '')}</textarea></label>
      <div class="under" style="margin:6px 0 10px" id="b-ord"></div>
      <details class="post"><summary><span class="titel">Fakta brevet bygger på (${(u.fakta || []).length})</span>${brev.kontroll?.siffror_ok === false ? '<span class="chip rod">siffra utanför fakta</span>' : ''}</summary><div class="innehall">${(u.fakta || []).map((f) => `<div class="handling"><b>${esc(f.pastaende)}</b> ${esc(f.kalla)}</div>`).join('') || '<div class="under">inga</div>'}</div></details>
      ${(brev.kontroll?.copy_fynd || []).length ? `<details class="post"><summary><span class="titel">Copykontrollens fynd (${brev.kontroll.copy_fynd.length})</span></summary><div class="innehall">${brev.kontroll.copy_fynd.map((f) => `<div class="handling"><b>${esc(f.typ)}</b> ${esc(f.text)} · ${esc(f.riktning)}</div>`).join('')}</div></details>` : ''}
      <details class="post"><summary><span class="titel">Sidfot som läggs till automatiskt</span></summary><div class="innehall"><pre style="white-space:pre-wrap">${esc(d.sidfot || '')}</pre></div></details>
      <div class="rad" style="margin-top:12px"><label>Mottagare <input id="b-epost" type="email" value="${esc(epost0)}" style="min-width:280px"></label>
        <label class="rad" id="b-person-rad" ${visaKryss ? '' : 'hidden'}><input id="b-person" type="checkbox" ${mott.bekraftad_person ? 'checked' : ''}> Jag bedömer att den här namngivna adressen är verksamhetens, inte en privat</label></div>
      <div class="rad" style="margin-top:12px">${g ? `<span class="chip ok">Godkänd ${tid(g.tid)}</span>` : '<span class="chip gul">Inte godkänd</span>'}
        <button class="knapp primar" id="b-godkann">${g ? 'Godkänn igen' : 'Godkänn'}</button>
        <button class="knapp" id="b-skicka" ${d.grind.ok ? '' : 'disabled'} title="${esc(d.grind.skal)}">Skicka via Resend</button>
        ${d.grind.ok ? '' : `<span class="under">${esc(d.grind.skal)}</span>`}<span id="b-svar" class="under"></span></div>
      ${u.ringmanus ? `<h3>Ringmanus</h3><div class="prosa">${esc(u.ringmanus)}</div>` : ''}
      <p class="under" style="margin:12px 0 0">Utkast ${tid(u.skapad)} · ${esc(u.modell || '')} · ${u.turer || '?'} turer${red.tid ? ' · redigerat ' + tid(red.tid) : ''}</p>`
    : d.brev_lage.pagar ? '<span class="chip acc puls">Skriver brev …</span>'
    : d.brev_lage.fel ? `<div class="meddelande fel">Brevet stoppades: ${esc(d.brev_lage.fel)}</div><p class="under">Skriv om för ett nytt försök.</p>`
    : '<div class="under">Inget utkast än. Välj verksamheten och tryck Skriv brev.</div>';
  $('#vy').innerHTML = `
    <p class="under" style="margin-bottom:6px"><a href="#/prospekt">Prospekt</a> · <a href="#/prospekt/${esc(k)}">${esc(k)}</a></p>
    <div class="rad mellan"><div><h1>${esc(p.namn)}</h1><div class="under" style="margin:0">${esc(info.join(' · '))}</div></div>
      <div class="rad">${pchip(p.status)}${p.fysisk_person ? '<span class="chip gul">enskild firma</span>' : `<span class="chip">${esc(p.jurform_text || '')}</span>`}
        ${sp.reklam ? '<span class="chip rod">reklamspärr</span>' : ''}${sp.epost ? '<span class="chip rod">e-postspärr</span>' : ''}${sp.telefon ? '<span class="chip rod">telefonspärr</span>' : ''}
        ${p.avvisad_skal ? `<span class="chip">${esc(p.avvisad_skal)}</span>` : ''}</div></div>
    <div class="rad" style="margin:12px 0">${knappar}<span id="p-svar" class="under"></span></div>
    <div class="kort" style="margin-bottom:14px"><div class="rad"><b>Sajt</b> ${sajtrad}</div>${p.kanaler && Object.keys(p.kanaler).length ? `<div class="under" style="margin:6px 0 0">Kanaler: ${Object.entries(p.kanaler).map(([n, u2]) => `<a href="${esc(u2)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(', ')}</div>` : ''}</div>
    ${d.bilder.length ? `<h2>Deras sajt</h2><div class="bilder">${bild(hitta(d.bilder, '', 390), 'Startsidan, mobil 390')}${bild(hitta(d.bilder, '', 1440), 'Startsidan, desktop 1440')}</div>` : ''}
    ${po.total != null ? `<h2>Att vinna: ${tal(po.total)} av 10${po.osaker ? ' <span class="chip gul">osäker mätning</span>' : ''}${po.svag ? ' <span class="chip rod">svag sajt</span>' : ''}</h2>
      <div class="siffror">${rader.map(([n, kk]) => `<div class="kort siffra"><div class="tal">${tal(po[kk])}</div><div class="etikett">${n} (10 = inget att vinna)</div></div>`).join('')}</div>
      ${Object.keys(lh).length ? `<p class="under">Lighthouse mobil: prestanda ${lh.prestanda ?? '–'}, tillgänglighet ${lh.tillganglighet ?? '–'}, bästa praxis ${lh.bastaPraxis ?? '–'}, SEO ${lh.seo ?? '–'}, LCP ${lh.lcpMs ?? '–'} ms; allvarliga axe-fel ${lh.axe_allvarliga ?? '–'}.</p>` : ''}
      <div class="kort">${(pr.varfor || []).map((v) => `<div class="varfor-rad"><span class="p">${v.poang > 0 ? '' : ''}${tal(v.poang)}</span><span class="k">${esc(v.kategori)}</span><span>${esc(v.varfor)}${v.varde != null && typeof v.varde !== 'boolean' ? ` <span class="under" style="display:inline">(${esc(String(v.varde))})</span>` : ''}</span></div>`).join('') || '<div class="under">inga avdrag</div>'}</div>`
      : p.status === 'utan-sajt' ? '<h2>Ingen sajt</h2><div class="under">Verksamheten saknar en egen webbplats som vi hittat. Ribban är deras Google-profil och kanaler; en demo kan ändå byggas.</div>' : ''}
    ${underlag.length ? `<h2>Fakta ur mätningen</h2><div class="chips">${underlag.map(([kk, v]) => `<span class="chip">${esc(kk)}: ${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</span>`).join('')}</div>` : ''}
    ${pr.verktygsfel && Object.keys(pr.verktygsfel).length ? `<p class="under">Verktyg som föll: ${Object.entries(pr.verktygsfel).map(([n, f]) => `${esc(n)} (${esc(String(f).slice(0, 80))})`).join('; ')}</p>` : ''}
    ${d.filer.length ? `<details class="post"><summary><span class="titel">Mätfiler (${d.filer.length})</span></summary><div class="innehall">${d.filer.map((f) => `<div><a href="/fil/${esc(f)}" target="_blank">${esc(f.replace('underlag/' + slug + '/', ''))}</a></div>`).join('')}</div></details>` : ''}
    ${d.bygge.finns ? `<h2>Demo</h2><div class="kort"><div class="rad"><a href="#/bygge/${esc(slug)}">Bygget ${esc(slug)}</a>${d.bygge.korning ? (d.bygge.korning.pagar ? '<span class="chip acc puls">Körning pågår</span>' : `<span class="chip">${esc(d.bygge.korning.resultat ? 'klar: ' + d.bygge.korning.resultat.utfall : 'avbruten')}</span>`) : ''}</div></div>` : ''}
    <h2>Brev</h2><div class="kort">${brevHtml}</div>
    ${d.utskick ? `<h2>Utskick</h2><div class="kort"><div class="rad"><span class="chip ok">Skickat ${d.skickat_dagar != null ? d.skickat_dagar + ' dagar sedan' : tid(d.utskick.tid)}</span><span class="chip">${esc(d.utskick.till)}</span>${d.utskick.torr ? '<span class="chip gul">torrkörning</span>' : `<span class="chip">resend ${esc(d.utskick.resend_id)}</span>`}</div><p class="under" style="margin:8px 0 0">Ämne: ${esc(d.utskick.amne)}</p>${p.svar ? `<p class="under" style="margin:4px 0 0">Svar: ${esc(p.svar.status)} ${tid(p.svar.tid)} ${esc(p.svar.not || '')}</p>` : ''}</div>` : ''}
    ${d.sparrad ? `<div class="meddelande fel" style="margin-top:14px">Adressen eller verksamheten står i spärrlistan: ${esc(d.sparrad.skal || '')}</div>` : ''}`;
  const fel = (m) => { $('#p-svar').innerHTML = `<span class="rod-text">${esc(m)}</span>`; };
  document.querySelectorAll('[data-h]').forEach((x) => x.onclick = async () => {
    const h = x.dataset.h; x.disabled = true;
    try {
      if (h === 'valj') await post(bas + '/status', { status: 'vald' });
      else if (h === 'avvisa') { const skal = prompt('Varför avvisas ' + p.namn + '?'); if (!skal) { x.disabled = false; return; } await post(bas + '/status', { status: 'avvisad', skal }); }
      else if (h === 'demo') { if (!confirm('Starta ett demobygge åt ' + p.namn + '? Det tar en till två timmar.')) { x.disabled = false; return; } await post(bas + '/demo', {}); }
      else if (h === 'brev') await post(bas + '/brev', {});
      else if (['svar', 'kund', 'nej'].includes(h)) { const not = prompt('Anteckning (valfritt)') ?? ''; await post(bas + '/status', { status: h, not }); }
      else if (h === 'stryk') { const skal = prompt('Skäl till strykningen', 'bad om det'); if (skal === null) { x.disabled = false; return; } if (!confirm('Stryk ' + p.namn + ' och lägg adressen i spärrlistan?')) { x.disabled = false; return; } await post(bas + '/stryk', { skal }); }
      else if (h === 'sajt') await post(bas + '/sajt', {});
      else if (h === 'sajt-manuell') { const url = $('#s-url').value.trim(); if (!url) { fel('ange en adress'); x.disabled = false; return; } await post(bas + '/sajt', { url }); }
      prospektkortvy(k, slug);
    } catch (err) { fel(err.message); x.disabled = false; }
  });
  const ordrakn = () => { const t = $('#b-text'); if (t) $('#b-ord').textContent = t.value.trim().split(/\s+/).filter(Boolean).length + ' ord (högst 120)'; };
  if ($('#b-text')) { ordrakn(); $('#b-text').oninput = ordrakn; }
  if ($('#b-epost')) $('#b-epost').oninput = () => { const e = $('#b-epost').value.trim(); $('#b-person-rad').hidden = !(e && !ROLL.test(e.split('@')[0])); };
  if ($('#b-godkann')) $('#b-godkann').onclick = async () => {
    $('#b-godkann').disabled = true;
    try { await post(bas + '/brev/godkann', { amne: $('#b-amne').value, text: $('#b-text').value, mottagare: { epost: $('#b-epost').value, bekraftad_person: !!$('#b-person')?.checked } }); prospektkortvy(k, slug); }
    catch (err) { $('#b-svar').innerHTML = `<span class="rod-text">${esc(err.message)}</span>`; $('#b-godkann').disabled = false; }
  };
  if ($('#b-skicka')) $('#b-skicka').onclick = async () => {
    if (!confirm('Skicka brevet till ' + $('#b-epost').value + ' från nortropic.se?')) return;
    $('#b-skicka').disabled = true;
    try { const r = await post(bas + '/skicka', {}); $('#b-svar').textContent = 'Skickat' + (r.torr ? ' (torrkörning)' : ', resend ' + r.resend_id) + '.'; setTimeout(() => prospektkortvy(k, slug), 1200); }
    catch (err) { $('#b-svar').innerHTML = `<span class="rod-text">${esc(err.message)}</span>`; $('#b-skicka').disabled = false; }
  };
  if ((d.brev_lage.pagar || d.bygge?.korning?.pagar) && p.status !== 'utkast') timer = setTimeout(() => prospektkortvy(k, slug), 6000);
}

function startavy() {
  aktivNav('starta');
  $('#vy').innerHTML = `
    <h1>Starta</h1><p class="under">Kommandona körs i Terminal, i repots rot. Hela kedjan från kundunderlag till leverans, med vem som startar vad och vilket kommando: README.md, avsnittet Kedjan från kundunderlag till leverans.</p>
    <div class="kort"><h3 style="margin-top:0">Helbygget åt en verksamhet</h3><p class="under" style="margin:0">Tar vid från startsidan du godkänt i vyn Prototyp och går sedan obevakat, oftast en till två timmar. Utan godkänd startsida stannar kor.sh och pekar på prototypen. Följ bygget under Översikt.</p>
      ${kommando('./kor.sh <slug> "Verksamhetens namn, Ort, https://deras-doman.se"')}
      <h3>Tre helbyggen över natten</h3><p class="under" style="margin:0">Vart och ett med en godkänd startsida; de körs ett i taget.</p>${kommando('./kor.sh a-slug "…" ; ./kor.sh b-slug "…" ; ./kor.sh c-slug "…"')}
      <h3>Genomför backloggen</h3><p class="under" style="margin:0">I en Claude Code-session i repot:</p>${kommando('implementera enligt backlog')}
      <h3>Kirurgen i en session</h3>${kommando('/kirurg https://…')}
      <h3>Rökprov efter ändringar i kontrollerna</h3>${kommando('kontroller/rokprov.sh')}</div>`;
}

// I telefonen: sajten på datorns adress i det lokala nätverket, som QR-kod (ritad på servern, inget tredjepartsanrop)
document.addEventListener('click', async (e) => {
  const k = e.target.closest('[data-qr]');
  if (!k) return;
  const d = $('#qr');
  try {
    const v = await post('/api/visa/' + encodeURIComponent(k.dataset.qr), {});  // POST: startar visningen bara från dashboardens egen sida (F13)
    d.querySelector('.innehall').innerHTML = v.natverk
      ? `${v.qr}<p><a href="${esc(v.natverk)}" target="_blank" rel="noopener">${esc(v.natverk)}</a></p><p class="under">Telefonen behöver vara på samma Wi-Fi. Bara sajten nås härifrån; dashboarden svarar bara på datorn.</p>`
      : `<p>Ingen visning i telefonen: ${esc(v.skal || '')}.</p>`;
  } catch (err) {
    d.querySelector('.innehall').innerHTML = `<p>${esc(String(err.message || err))}</p>`;
  }
  d.showModal();
});

async function route() {
  clearTimeout(timer);
  const h = location.hash.replace(/^#\/?/, '');
  try {
    if (h.startsWith('bygge/')) return await byggevy(decodeURIComponent(h.slice(6)));
    if (h === 'backlog') return await backlogvy();
    if (h === 'kirurgen') return await kirurgvy();
    if (h === 'lardomar') return await lardomvy();
    if (h === 'ab') return await abvy();
    if (h === 'kalibrering') return await kalibreringvy();
    if (h === 'designprov' || h.startsWith('designprov/')) return await designprovvy(decodeURIComponent(h.slice(11)));
    if (h === 'prototyp' || h.startsWith('prototyp/')) return await prototypvy(decodeURIComponent(h.slice(9)));
    if (h.startsWith('prospekt')) { const d = h.split('/'); return d[2] ? await prospektkortvy(decodeURIComponent(d[1]), decodeURIComponent(d[2])) : d[1] ? await kampanjvy(decodeURIComponent(d[1])) : await prospektvy(); }
    if (h === 'starta') return startavy();
    return await oversikt();
  } catch (e) { $('#vy').innerHTML = `<div class="meddelande fel">Fel: ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);
route();
</script>
